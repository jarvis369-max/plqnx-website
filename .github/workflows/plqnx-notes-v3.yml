name: PLQNX NOTES Studio 3 build
on:
  push:
    branches: [plqnx-notes-v3]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract Android source
        shell: bash
        run: |
          set -euo pipefail
          base64 -d android/PLQNX_NOTES_v3_src.tar.xz.b64 > /tmp/plqnx-v3.tar.xz
          xz -t /tmp/plqnx-v3.tar.xz
          mkdir -p /tmp/android-v3-src
          tar -xJf /tmp/plqnx-v3.tar.xz -C /tmp/android-v3-src
          test -f /tmp/android-v3-src/PLQNX_NOTES_V3/app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK API 36
        run: |
          echo "y" | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile, lint and package V3
        working-directory: /tmp/android-v3-src/PLQNX_NOTES_V3
        run: |
          gradle --no-daemon --stacktrace assembleDebug bundleRelease lintDebug
      - name: Inspect APK package and version
        shell: bash
        run: |
          test -s /tmp/android-v3-src/PLQNX_NOTES_V3/app/build/outputs/apk/debug/app-debug.apk
          test -s /tmp/android-v3-src/PLQNX_NOTES_V3/app/build/outputs/bundle/release/app-release.aab
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging /tmp/android-v3-src/PLQNX_NOTES_V3/app/build/outputs/apk/debug/app-debug.apk | grep -E '^(package:|sdkVersion:|targetSdkVersion:|application-label:)'
      - name: Upload APK, AAB and lint report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PLQNX_NOTES_Studio_3_v3
          path: |
            /tmp/android-v3-src/PLQNX_NOTES_V3/app/build/outputs/apk/debug/*.apk
            /tmp/android-v3-src/PLQNX_NOTES_V3/app/build/outputs/bundle/release/*.aab
            /tmp/android-v3-src/PLQNX_NOTES_V3/app/build/reports/lint-results-debug.html
          if-no-files-found: error
      - name: Lint details if compilation fails
        if: failure()
        working-directory: /tmp/android-v3-src/PLQNX_NOTES_V3
        run: |
          if [ -f app/build/reports/lint-results-debug.txt ]; then cat app/build/reports/lint-results-debug.txt; fi

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: PLQNX_NOTES_Studio_3_v3
          path: /tmp/plqnx-apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          script: |
            set -e
            APK=$(find /tmp/plqnx-apk -name '*.apk' -print -quit)
            test -n "$APK"
            adb install "$APK"
            adb shell am start -n com.plqnx.notes/.MainActivity
            sleep 5
            adb shell pidof com.plqnx.notes
            adb shell screencap -p /sdcard/plqnx_home.png
            adb pull /sdcard/plqnx_home.png "$GITHUB_WORKSPACE/PLQNX_V3_home.png"
            adb shell am start -n com.plqnx.notes/.MainActivity -a com.plqnx.notes.NEW_NOTE
            sleep 3
            adb shell pidof com.plqnx.notes
            adb shell screencap -p /sdcard/plqnx_editor.png
            adb pull /sdcard/plqnx_editor.png "$GITHUB_WORKSPACE/PLQNX_V3_editor.png"
      - name: Collect emulator QA screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PLQNX_V3_QA_screenshots
          path: PLQNX_V3_*.png
          if-no-files-found: warn
