name: Plqnx notes reference UI emulator test
on:
  push:
    branches: [plqnx-notes-reference-redesign]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Extract Android source
        run: |
          set -euo pipefail
          base64 -d android/plqnx-notes-reference-src.tar.xz.b64 > /tmp/plqnx-reference.tar.xz
          mkdir -p /tmp/plqnx-reference
          tar -xJf /tmp/plqnx-reference.tar.xz -C /tmp/plqnx-reference
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile test APK
        working-directory: /tmp/plqnx-reference/PlqnxNotes
        run: gradle --no-daemon assembleDebug
      - name: Enable Linux KVM emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install app, tap + and capture reference-matched screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-boot-timeout: 900
          script: bash android/plqnx-reference-ui-smoke.sh
      - name: Upload UI screenshots and crash log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Plqnx-reference-UI-test
          path: |
            reference-home.png
            reference-home-after.png
            reference-editor.png
            reference-home.xml
            reference-home-after.xml
            reference-editor.xml
            reference-runtime.log
          if-no-files-found: warn
