name: Plqnx notes command UI Android build
on:
  push:
    branches: [plqnx-notes-command-ui]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Unpack Android project
        run: |
          set -euo pipefail
          base64 -d android/plqnx-notes-command-v9-source.tar.xz.b64 > /tmp/plqnx-command.tar.xz
          xz -t /tmp/plqnx-command.tar.xz
          mkdir -p /tmp/plqnx-work
          tar -xJf /tmp/plqnx-command.tar.xz -C /tmp/plqnx-work
          test -s /tmp/plqnx-work/PlqnxNotes/app/build.gradle
          test -s /tmp/plqnx-work/PlqnxNotes/app/src/main/java/com/plqnx/notes/CommandStyle.java
          sed -i 's/item.setMinHeight(d(62))/item.setMinimumHeight(d(62))/' /tmp/plqnx-work/PlqnxNotes/app/src/main/java/com/plqnx/notes/SignatureHome.java
          grep -q 'item.setMinimumHeight(d(62))' /tmp/plqnx-work/PlqnxNotes/app/src/main/java/com/plqnx/notes/SignatureHome.java
          sed -i 's/android.text.Layout.BREAK_STRATEGY_HIGH_QUALITY/android.graphics.text.LineBreaker.BREAK_STRATEGY_HIGH_QUALITY/' /tmp/plqnx-work/PlqnxNotes/app/src/main/java/com/plqnx/notes/SignatureHome.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK 36
        run: |
          echo "y" | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build and lint Android app
        working-directory: /tmp/plqnx-work/PlqnxNotes
        run: gradle --no-daemon --stacktrace assembleDebug bundleRelease lintDebug
      - name: Verify package version signing and no internet permission
        working-directory: /tmp/plqnx-work/PlqnxNotes
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          BUNDLE=app/build/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$BUNDLE"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/plqnx-badging.txt
          grep -q "name='com.plqnx.notes'" /tmp/plqnx-badging.txt
          grep -q "versionCode='12'" /tmp/plqnx-badging.txt
          grep -q "application-label:'Plqnx notes'" /tmp/plqnx-badging.txt
          ! grep -q "android.permission.INTERNET" /tmp/plqnx-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          unzip -t "$APK" | tail -n 2
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Plqnx-notes-command-console-test-build
          path: |
            /tmp/plqnx-work/PlqnxNotes/app/build/outputs/apk/debug/app-debug.apk
            /tmp/plqnx-work/PlqnxNotes/app/build/outputs/bundle/release/app-release.aab
            /tmp/plqnx-work/PlqnxNotes/app/build/reports/lint-results-debug.html
          if-no-files-found: error
      - name: Print lint report on error
        if: failure()
        working-directory: /tmp/plqnx-work/PlqnxNotes
        run: |
          if [ -f app/build/reports/lint-results-debug.txt ]; then head -c 14000 app/build/reports/lint-results-debug.txt; fi
