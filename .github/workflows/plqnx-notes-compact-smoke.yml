name: Plqnx notes compact-screen smoke test
on:
  push:
    branches: [plqnx-notes-adaptive-keep]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Plqnx_notes_Adaptive_Keep_Build
          run-id: 42110148316
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./built
      - name: Verify downloadable APK
        run: test -s built/outputs/apk/debug/app-debug.apk
      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -eux
            adb shell wm size 720x1600
            adb shell wm density 320
            adb shell settings put system font_scale 1.4
            adb install built/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -n com.plqnx.notes/.MainActivity
            sleep 5
            adb exec-out screencap -p > PLQNX_HOME_360dp.png
            adb shell uiautomator dump /data/local/tmp/plqnx-home.xml
            adb exec-out cat /data/local/tmp/plqnx-home.xml > PLQNX_HOME_UI.xml
            python3 .github/scripts/plqnx_smoke.py tap PLQNX_HOME_UI.xml
            sleep 4
            adb exec-out screencap -p > PLQNX_EDITOR_360dp.png
            adb shell uiautomator dump /data/local/tmp/plqnx-editor.xml
            adb exec-out cat /data/local/tmp/plqnx-editor.xml > PLQNX_EDITOR_UI.xml
            python3 .github/scripts/plqnx_smoke.py verify PLQNX_EDITOR_UI.xml
            adb logcat -d -s AndroidRuntime:E > PLQNX_ANDROID_CRASH.log
            if grep -q "FATAL EXCEPTION" PLQNX_ANDROID_CRASH.log; then
              cat PLQNX_ANDROID_CRASH.log
              exit 11
            fi
      - name: Upload screen captures and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Plqnx_notes_Compact_Screen_Test
          path: |
            PLQNX_HOME_360dp.png
            PLQNX_EDITOR_360dp.png
            PLQNX_HOME_UI.xml
            PLQNX_EDITOR_UI.xml
            PLQNX_ANDROID_CRASH.log
          if-no-files-found: warn
