name: PLQNX Languages 40 emulator and layout QA
on:
  push:
    branches: [plqnx-languages-40-voice]
    paths:
      - android/plqnx40-emulator-test.py
      - .github/workflows/plqnx-languages-40-emulator.yml
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PLQNX-Languages-40-APK
          run-id: 44540153076
          github-token: ${{ github.token }}
          path: /tmp/plqnx40-artifact
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify onboarding, voice, Latin typing and compact layouts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-boot-timeout: 900
          disable-animations: true
          script: python3 android/plqnx40-emulator-test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PLQNX-Languages-40-QA-Screens
          path: |
            *.png
            *.xml
            android-runtime.log
          if-no-files-found: warn
