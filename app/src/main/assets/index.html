lass ThreadStatesDemo {\n    public static void main(String[] args) throws InterruptedException {\n        Thread t = new Thread(() -> System.out.println(\"Working\"));\n        System.out.println(t.getState());\n        t.start();\n        t.join();\n        System.out.println(t.getState());\n    }\n}","output":"NEW\nWorking\nTERMINATED","flow":"NEW --start()--> RUNNABLE --run ends--> TERMINATED\nRUNNABLE ↔ BLOCKED (monitor lock)\nRUNNABLE ↔ WAITING (wait/join/notify)\nRUNNABLE ↔ TIMED_WAITING (sleep/timeout)","recap":"The six official Thread.State values are NEW, RUNNABLE, BLOCKED, WAITING, TIMED_WAITING and TERMINATED.","tip":"Label transitions clearly in the exam diagram; avoid treating RUNNING as a seventh enum value."},{"id":"B30","part":"B","number":30,"marks":10,"question":"Explain the two ways of creating a thread in Java with suitable programs.","topic":"Threads","definition":"Two basic ways to define work for a Java thread are extending Thread and implementing Runnable.","points":["Method 1: class Child extends Thread; override public void run(); create instance and invoke start().","Method 2: class Task implements Runnable; define public void run(); pass task to new Thread(task).start().","Never call run() directly if the goal is to start a new thread: run() is then an ordinary method call.","Runnable separates task logic from Thread and allows other class inheritance.","Each thread may be scheduled differently, so mixed output order is not guaranteed.","For modern applications, ExecutorService is often used, but the exam asks for these two foundational methods."],"syntax":"class T extends Thread { public void run(){} }\nclass R implements Runnable { public void run(){} }","code":"class MyThread extends Thread {\n    public void run(){ System.out.println(\"Extending Thread\"); }\n}\nclass MyTask implements Runnable {\n    public void run(){ System.out.println(\"Implementing Runnable\"); }\n}\npublic class TwoThreads {\n    public static void main(String[] args) throws InterruptedException {\n        Thread a = new MyThread();\n        Thread b = new Thread(new MyTask());\n        a.start(); a.join();\n        b.start(); b.join();\n    }\n}","output":"Extending Thread\nImplementing Runnable","flow":"Create work class → extend Thread / implement Runnable → new Thread → start() → run()","recap":"Thread.start() creates a new execution path; Thread.run() alone does not.","tip":""},{"id":"B31","part":"B","number":31,"marks":10,"question":"Write a Java program to create a thread by extending the Thread class.","topic":"Threads","definition":"A thread can be created by extending java.lang.Thread, overriding run() and starting an instance using start().","points":["Create a subclass of Thread.","Override public void run() to define the task.","Construct the thread in main().","Call start() to request a separate execution path; JVM invokes run().","Calling run() directly does not create a new thread.","Use join() when the main thread must wait for completion; concurrent ordering can vary without coordination."],"syntax":"class Worker extends Thread { public void run(){ ... } }\nnew Worker().start();","code":"class NumberThread extends Thread {\n    @Override public void run(){\n        for (int i = 1; i <= 3; i++)\n            System.out.println(\"Number: \" + i);\n    }\n}\npublic class ThreadClassDemo {\n    public static void main(String[] args) throws InterruptedException {\n        NumberThread t = new NumberThread();\n        t.start();\n        t.join();\n        System.out.println(\"Finished\");\n    }\n}","output":"Number: 1\nNumber: 2\nNumber: 3\nFinished","flow":"Thread object (NEW) → start() → RUNNABLE → run() executes → TERMINATED","recap":"Extending Thread: override run(), call start(), optionally join().","tip":""},{"id":"B32","part":"B","number":32,"marks":10,"question":"Write a Java program to create a thread by implementing the Runnable interface.","topic":"Threads","definition":"A thread can be created by implementing Runnable and passing that task to a Thread object.","points":["Define a class implements Runnable and override public void run().","Create an instance of the task class.","Pass it to new Thread(task).","Call start() on Thread, not on the Runnable task.","This keeps the task class free to extend a different superclass.","A lambda can represent Runnable because it has one abstract method (modern Java)."],"syntax":"class Task implements Runnable { public void run(){ ... } }\nnew Thread(new Task()).start();","code":"class MessageTask implements Runnable {\n    @Override public void run(){\n        for (int i = 1; i <= 3; i++)\n            System.out.println(\"Message \" + i);\n    }\n}\npublic class RunnableDemo {\n    public static void main(String[] args) throws InterruptedException {\n        Runnable task = new MessageTask();\n        Thread t = new Thread(task);\n        t.start();\n        t.join();\n        System.out.println(\"Done\");\n    }\n}","output":"Message 1\nMessage 2\nMessage 3\nDone","flow":"Implement Runnable → create Task → new Thread(task) → start() → task.run()","recap":"Runnable defines a task; Thread executes it.","tip":""},{"id":"B33","part":"B","number":33,"marks":10,"question":"Explain thread synchronization with a suitable Java program.","topic":"Threads","definition":"Synchronization protects a critical section when several threads access shared mutable data.","points":["A race condition occurs when result depends on unpredictable interleaving of reads and writes.","synchronized obtains an intrinsic monitor lock on an object before entering a block or method.","At most one thread holds a given monitor at a time.","Other threads contending for that monitor wait until it is released.","Atomic increment count++ requires coordination when used on a shared counter.","Synchronization ensures mutual exclusion and visibility for operations guarded by the same lock; incorrect locking can deadlock."],"syntax":"synchronized void increment() { count++; }\n// or synchronized(lock) { ... }","code":"class Counter {\n    private int count = 0;\n    public synchronized void increment(){ count++; }\n    public synchronized int get(){ return count; }\n}\npublic class SyncDemo {\n    public static void main(String[] args) throws InterruptedException {\n        Counter c = new Counter();\n        Runnable work = () -> {\n            for (int i = 0; i < 1000; i++) c.increment();\n        };\n        Thread t1 = new Thread(work);\n        Thread t2 = new Thread(work);\n        t1.start(); t2.start();\n        t1.join(); t2.join();\n        System.out.println(\"Count: \" + c.get());\n    }\n}","output":"Count: 2000","flow":"Thread 1 / Thread 2 → Same monitor → One enters synchronized increment → Release → Next thread enters","recap":"Synchronization serializes access to a shared critical section and prevents lost updates.","tip":""},{"id":"B34","part":"B","number":34,"marks":10,"question":"Explain thread priorities and the methods used to set and get thread priorities.","topic":"Threads","definition":"Java thread priorities are integer scheduling hints that can influence, but not guarantee, scheduling order.","points":["Thread.MIN_PRIORITY has value 1.","Thread.NORM_PRIORITY is 5 (the typical default).","Thread.MAX_PRIORITY has value 10.","setPriority(int p) changes a thread priority within the valid range and subject to group constraints.","getPriority() returns the assigned priority.","Scheduler policies differ across platforms; priority must never be used to guarantee which thread runs first.","start(), join(), sleep() and yield() are related Thread methods but not priority getters/setters."],"syntax":"Thread t = new Thread();\nt.setPriority(Thread.MAX_PRIORITY);\nint priority = t.getPriority();","code":"public class PriorityDemo {\n    public static void main(String[] args) {\n        Thread low = new Thread(() -> {});\n        Thread high = new Thread(() -> {});\n        low.setPriority(Thread.MIN_PRIORITY);\n        high.setPriority(Thread.MAX_PRIORITY);\n        System.out.println(\"Low: \" + low.getPriority());\n        System.out.println(\"High: \" + high.getPriority());\n    }\n}","output":"Low: 1\nHigh: 10","flow":"Create Thread → setPriority(1..10) → Scheduler sees hint → getPriority()","recap":"MIN=1, NORM=5, MAX=10; priorities do not guarantee execution order.","tip":""},{"id":"B35","part":"B","number":35,"marks":10,"question":"Explain the applet life cycle with a neat diagram.","topic":"Applets & AWT","definition":"An applet is a legacy AWT-based Java GUI component historically loaded by an applet container, with a defined lifecycle.","points":["init() is called once after loading to initialize resources and controls.","start() is called after initialization and whenever the applet becomes active again.","paint(Graphics) draws the component when a repaint is needed; it can run many times.","stop() is called when the applet becomes inactive or the user navigates away.","destroy() is called before unloading to free resources.","The order may include several start/stop cycles; drawing is not a strict one-time lifecycle state.","Current browsers do not support Java applets; use the prescribed legacy tools for syllabus practice."],"syntax":"public void init() {}\npublic void start() {}\npublic void paint(Graphics g) {}\npublic void stop() {}\npublic void destroy() {}","code":"import java.applet.Applet;\nimport java.awt.Graphics;\n/* Legacy Java applet for course study (JDK 8 tools). */\npublic class LifeApplet extends Applet {\n    public void init(){ setBackground(java.awt.Color.WHITE); }\n    public void start(){ repaint(); }\n    public void paint(Graphics g){ g.drawString(\"Java Applet\", 20, 30); }\n    public void stop(){}\n    public void destroy(){}\n}\n// Historical HTML: <applet code=\"LifeApplet.class\"\n// width=\"300\" height=\"120\"></applet>","output":"Graphical area displays: Java Applet","flow":"LOAD → init() → start() → paint() as needed\nACTIVE ↔ stop() → start() again\nUNLOAD → stop() → destroy()","recap":"Draw init → start → stop → start loop → destroy, and show paint as a rendering callback.","tip":""},{"id":"B36","part":"B","number":36,"marks":10,"question":"Explain the different methods used in the applet life cycle with a suitable program.","topic":"Applets & AWT","definition":"Applet callback methods allow a Java applet to initialize, activate, draw, pause and release resources.","points":["init(): executed once at initial load; create controls and initialize state.","start(): invoked when the applet becomes active; restart eligible activities.","paint(Graphics): called when the drawing surface needs painting; use Graphics for shapes/text.","stop(): invoked when inactive; pause tasks.","destroy(): invoked during disposal; release resources.","repaint() requests a subsequent repaint; no need to call paint() directly.","This is legacy syllabus content; modern Java GUI uses other frameworks."],"syntax":"@Override public void init() { ... }\n@Override public void paint(Graphics g) { ... }","code":"import java.applet.Applet;\nimport java.awt.*;\npublic class AppletMethods extends Applet {\n    String text;\n    @Override public void init(){ text = \"Initialized\"; }\n    @Override public void start(){ text = \"Running\"; repaint(); }\n    @Override public void paint(Graphics g){\n        g.setColor(Color.BLUE);\n        g.drawString(text, 30, 40);\n    }\n    @Override public void stop(){ text = \"Stopped\"; }\n    @Override public void destroy(){ text = null; }\n}\n// Run only with a legacy applet-capable viewer/JDK environment.","output":"Graphical output while active: Running","flow":"Load → init() → start() → paint() → stop() → optional start() → destroy()","recap":"Lifecycle four: init/start/stop/destroy; paint draws the output.","tip":""},{"id":"B37","part":"B","number":37,"marks":10,"question":"Explain the AWT class hierarchy and important AWT controls.","topic":"Applets & AWT","definition":"AWT (Abstract Window Toolkit) is Java’s legacy GUI library containing components, containers, layout managers and event APIs.","points":["Component is the base for visible controls such as Button, Label, TextComponent, Checkbox, Choice, List, Scrollbar and Canvas.","Container extends Component and holds other components.","Panel and Window extend Container; Frame and Dialog extend Window.","Applet extends Panel and therefore is an AWT container.","TextField and TextArea extend TextComponent.","Layout managers (FlowLayout, BorderLayout, GridLayout) arrange controls; event listeners handle user actions.","AWT components are heavyweight, tied to native peers on many platforms."],"syntax":"Frame f = new Frame(\"Demo\");\nf.setLayout(new FlowLayout());\nf.add(new Button(\"Click\"));","code":"import java.awt.*;\nimport java.awt.event.*;\npublic class AWTControls {\n    public static void main(String[] args) {\n        Frame f = new Frame(\"AWT Controls\");\n        f.setLayout(new FlowLayout());\n        f.add(new Label(\"Name:\"));\n        f.add(new TextField(12));\n        f.add(new Button(\"Submit\"));\n        f.add(new Checkbox(\"Remember\"));\n        f.add(new Choice());\n        f.setSize(340, 170);\n        f.addWindowListener(new WindowAdapter() {\n            public void windowClosing(WindowEvent e){ f.dispose(); }\n        });\n        f.setVisible(true);\n    }\n}","output":"AWT window with Label, TextField, Button, Checkbox and Choice.","flow":"Component → Container → Panel → Applet\nComponent → Container → Window → Frame/ Dialog\nComponent → TextComponent → TextField/TextArea\nComponent → Button/Label/Checkbox/Choice/List/Scrollbar","recap":"AWT tree begins at Component; Container hosts children; Applet extends Panel.","tip":""},{"id":"B38","part":"B","number":38,"marks":10,"question":"Write a Java AWT program to add two numbers using Label, TextField and Button.","topic":"Applets & AWT","definition":"An AWT addition program uses Label for prompts, TextField to enter/display values and Button to trigger calculation.","points":["Build a Frame with two input TextField controls and one output TextField.","Add Label components to describe each field.","Add a Button labelled Add.","Register ActionListener using addActionListener.","In actionPerformed, parse entered values, calculate sum and set the result field; handle bad numeric input.","Register a window-closing listener so the sample can exit cleanly.","This is AWT desktop code, suitable to illustrate applet-style controls."],"syntax":"button.addActionListener(e -> result.setText(...));","code":"import java.awt.*;\nimport java.awt.event.*;\npublic class AWTAddition extends Frame implements ActionListener {\n    TextField a = new TextField(8), b = new TextField(8);\n    TextField result = new TextField(10);\n    Button add = new Button(\"Add\");\n    AWTAddition() {\n        super(\"Add Two Numbers\");\n        setLayout(new FlowLayout());\n        add(new Label(\"First:\")); add(a);\n        add(new Label(\"Second:\")); add(b);\n        add(add); add(new Label(\"Sum:\")); add(result);\n        result.setEditable(false);\n        add.addActionListener(this);\n        addWindowListener(new WindowAdapter() {\n            public void windowClosing(WindowEvent e){ dispose(); }\n        });\n        setSize(300, 210); setVisible(true);\n    }\n    public void actionPerformed(ActionEvent e) {\n        try {\n            int sum = Integer.parseInt(a.getText())\n                    + Integer.parseInt(b.getText());\n            result.setText(String.valueOf(sum));\n        } catch (NumberFormatException ex) {\n            result.setText(\"Invalid input\");\n        }\n    }\n    public static void main(String[] args){ new AWTAddition(); }\n}","output":"Enter 10 and 20, click Add → Sum field displays 30.","flow":"Input TextFields → Click Button → ActionEvent → actionPerformed → parse → add → result.setText()","recap":"AWT addition needs Label + TextField + Button + ActionListener.","tip":""},{"id":"B39","part":"B","number":39,"marks":10,"question":"Explain the event delegation model in Java with a suitable example.","topic":"Applets & AWT","definition":"The event delegation model is a Java GUI mechanism in which a source generates an event and registered listener objects handle it.","points":["Event source: GUI component where event occurs, such as Button.","Event object: describes the action, such as ActionEvent.","Listener interface: specifies callback methods, such as ActionListener.actionPerformed().","Registration: source.addActionListener(listener) connects source and handler.","When the user acts, the event-dispatch mechanism calls the listener method with the event object.","This separates UI controls from event-handling logic and is central to AWT/Swing programming."],"syntax":"source.addActionListener(listener);\npublic void actionPerformed(ActionEvent e) { ... }","code":"import java.awt.*;\nimport java.awt.event.*;\npublic class DelegationDemo extends Frame implements ActionListener {\n    Button b = new Button(\"Press\");\n    Label label = new Label(\"Waiting\");\n    DelegationDemo() {\n        setLayout(new FlowLayout()); add(b); add(label);\n        b.addActionListener(this);\n        addWindowListener(new WindowAdapter(){\n            public void windowClosing(WindowEvent e){ dispose(); }\n        });\n        setSize(250, 130); setVisible(true);\n    }\n    public void actionPerformed(ActionEvent e){ label.setText(\"Clicked!\"); }\n    public static void main(String[] args){ new DelegationDemo(); }\n}","output":"Press the button → label changes to Clicked!","flow":"User clicks → Button (source) → ActionEvent → ActionListener → actionPerformed()","recap":"Five essentials: source, event, listener, registration and callback.","tip":""},{"id":"B40","part":"B","number":40,"marks":10,"question":"Explain different event classes and listener interfaces in Java.","topic":"Applets & AWT","definition":"Java AWT defines event classes that carry event details and listener interfaces that define response methods.","points":["ActionEvent ↔ ActionListener: actionPerformed().","ItemEvent ↔ ItemListener: itemStateChanged().","KeyEvent ↔ KeyListener: keyPressed(), keyReleased(), keyTyped().","MouseEvent ↔ MouseListener: clicked, pressed, released, entered, exited.","MouseEvent ↔ MouseMotionListener: mouseMoved(), mouseDragged().","WindowEvent ↔ WindowListener: closing, opened, activated and other window callbacks.","AdjustmentEvent ↔ AdjustmentListener: adjustmentValueChanged(); TextEvent ↔ TextListener: textValueChanged().","Adapter classes such as MouseAdapter and WindowAdapter offer empty implementations of multiple callbacks."],"syntax":"button.addActionListener(e -> ...);\nframe.addKeyListener(new KeyAdapter(){ public void keyPressed(KeyEvent e){...} });","code":"import java.awt.*;\nimport java.awt.event.*;\npublic class EventsOverview extends Frame {\n    EventsOverview() {\n        Button b = new Button(\"Tap\");\n        b.addActionListener(e -> System.out.println(\"ActionEvent\"));\n        add(b);\n        addWindowListener(new WindowAdapter() {\n            public void windowClosing(WindowEvent e){ dispose(); }\n        });\n        setSize(240, 120); setVisible(true);\n    }\n    public static void main(String[] args){ new EventsOverview(); }\n}","output":"Click Tap → console shows ActionEvent.","flow":"Source (Button/Checkbox/Key/Mouse) → Event class → Matching listener → Callback","recap":"Match event to listener: Action→ActionListener; Key→KeyListener; Mouse→MouseListener; Item→ItemListener.","tip":""},{"id":"B41","part":"B","number":41,"marks":10,"question":"Write a Java program to handle keyboard events.","topic":"Applets & AWT","definition":"Keyboard events in AWT are represented by KeyEvent and handled with KeyListener or KeyAdapter.","points":["keyPressed() occurs when a key goes down; keyReleased() when released; keyTyped() for character input.","Components must have keyboard focus to receive KeyEvents.","Add a listener with addKeyListener().","A KeyAdapter can override only methods needed without implementing all three.","KeyEvent.getKeyChar() retrieves typed characters; getKeyCode() helps identify non-character keys.","Show feedback in a Label or TextField when keys arrive."],"syntax":"component.addKeyListener(new KeyAdapter(){ @Override public void keyTyped(KeyEvent e){...} });","code":"import java.awt.*;\nimport java.awt.event.*;\npublic class KeyboardDemo extends Frame {\n    TextField input = new TextField(15);\n    Label message = new Label(\"Type into the field\");\n    KeyboardDemo(){\n        setLayout(new FlowLayout());\n        add(input); add(message);\n        input.addKeyListener(new KeyAdapter(){\n            @Override public void keyReleased(KeyEvent e){\n                message.setText(\"Last key: \" + e.getKeyChar());\n            }\n        });\n        addWindowListener(new WindowAdapter(){\n            public void windowClosing(WindowEvent e){ dispose(); }\n        });\n        setSize(330, 160); setVisible(true);\n    }\n    public static void main(String[] args){ new KeyboardDemo(); }\n}","output":"Type J in the TextField → label shows Last key: J (after release).","flow":"User presses key → focused TextField → KeyEvent → KeyAdapter.keyReleased → Update Label","recap":"KeyListener methods: keyPressed, keyReleased, keyTyped; keyboard focus is required.","tip":""},{"id":"B42","part":"B","number":42,"marks":10,"question":"Write a Java program to handle mouse events.","topic":"Applets & AWT","definition":"Mouse events describe pointer actions and are processed by MouseListener and MouseMotionListener.","points":["MouseListener: mouseClicked, mousePressed, mouseReleased, mouseEntered, mouseExited.","MouseMotionListener: mouseMoved, mouseDragged.","addMouseListener registers click/press/entry callbacks.","addMouseMotionListener registers movement and dragging callbacks.","MouseEvent.getX() and getY() give pointer coordinates relative to the component.","MouseAdapter implements both mouse interfaces with default empty methods and simplifies event handlers."],"syntax":"addMouseListener(new MouseAdapter(){ public void mouseClicked(MouseEvent e){...} });","code":"import java.awt.*;\nimport java.awt.event.*;\npublic class MouseDemo extends Frame {\n    Label label = new Label(\"Click inside the window\");\n    MouseDemo() {\n        setLayout(new FlowLayout()); add(label);\n        addMouseListener(new MouseAdapter() {\n            @Override public void mouseClicked(MouseEvent e) {\n                label.setText(\"Click: \" + e.getX() + \", \" + e.getY());\n            }\n        });\n        addWindowListener(new WindowAdapter(){\n            public void windowClosing(WindowEvent e){ dispose(); }\n        });\n        setSize(360, 180); setVisible(true);\n    }\n    public static void main(String[] args){ new MouseDemo(); }\n}","output":"Click inside frame → label displays pointer coordinates, e.g. Click: 120, 80.","flow":"Mouse action → MouseEvent → MouseListener callback → getX()/getY() → Update Label","recap":"MouseListener = 5 callbacks; MouseMotionListener = moved + dragged.","tip":""},{"id":"B43","part":"B","number":43,"marks":10,"question":"Explain the Label, TextField, List and Choice controls with their constructors and methods.","topic":"Applets & AWT","definition":"Label, TextField, List and Choice are AWT controls for displaying text, accepting input and choosing items.","points":["Label displays non-editable text; Label(), Label(String), Label(String,int alignment); setText/getText modify/read text.","TextField accepts single-line input; TextField(), TextField(int columns), TextField(String), TextField(String,int); getText/setText/setEchoChar are useful methods.","List displays a scrollable list; List(), List(int rows), List(int rows,boolean multipleMode); add(String), getSelectedItem(), select(int) are common.","Choice is a compact dropdown; Choice(); add(String), getSelectedItem(), select(int) are common.","These controls are Components and may be added to a Container.","Set an appropriate layout manager so controls remain visible."],"syntax":"Label l = new Label(\"Name\");\nTextField t = new TextField(15);\nList list = new List(3,false);\nChoice c = new Choice();","code":"import java.awt.*;\nimport java.awt.event.*;\npublic class FourControlsDemo extends Frame {\n    FourControlsDemo(){\n        setLayout(new FlowLayout());\n        Label l = new Label(\"Language\");\n        TextField t = new TextField(\"Student\", 12);\n        List list = new List(3, false);\n        list.add(\"Java\"); list.add(\"Python\");\n        Choice choice = new Choice();\n        choice.add(\"C\"); choice.add(\"Java\");\n        add(l); add(t); add(list); add(choice);\n        addWindowListener(new WindowAdapter(){\n            public void windowClosing(WindowEvent e){ dispose(); }\n        });\n        setSize(360, 240); setVisible(true);\n    }\n    public static void main(String[] args){ new FourControlsDemo(); }\n}","output":"AWT window shows a Label, prefilled TextField, List and Choice dropdown.","flow":"Container → Label / TextField / List / Choice → User interaction → Selection/text methods","recap":"Label displays; TextField inputs; List shows multiple rows; Choice shows dropdown.","tip":""},{"id":"B44","part":"B","number":44,"marks":10,"question":"Explain the Checkbox, CheckboxGroup and Scrollbar controls with suitable examples.","topic":"Applets & AWT","definition":"Checkbox represents a toggle, CheckboxGroup makes checkboxes mutually exclusive, and Scrollbar chooses a value over a range.","points":["Checkbox(String label) creates a toggle; getState()/setState(boolean) read/change it.","CheckboxGroup groups Checkbox objects; only one group member can be selected; getSelectedCheckbox() retrieves selection.","Scrollbar() defaults to vertical; Scrollbar(int orientation) chooses orientation.","Full Scrollbar constructor: (orientation, value, visible, minimum, maximum).","addItemListener handles checkbox selection changes; addAdjustmentListener handles scrollbar changes.","Scrollbar.getValue()/setValue(int) read/change the current value; horizontal/vertical orientation constants are provided."],"syntax":"Checkbox c = new Checkbox(\"Music\", true);\nCheckboxGroup g = new CheckboxGroup();\nScrollbar s = new Scrollbar(Scrollbar.HORIZONTAL, 20, 10, 0, 100);","code":"import java.awt.*;\nimport java.awt.event.*;\npublic class SelectControlsDemo extends Frame {\n    SelectControlsDemo(){\n        setLayout(new FlowLayout());\n        Checkbox news = new Checkbox(\"News\", true);\n        CheckboxGroup group = new CheckboxGroup();\n        Checkbox a = new Checkbox(\"A\", group, true);\n        Checkbox b = new Checkbox(\"B\", group, false);\n        Scrollbar scroll = new Scrollbar(Scrollbar.HORIZONTAL, 25, 10, 0, 100);\n        Label value = new Label(\"Value: 25\");\n        scroll.addAdjustmentListener(e -> value.setText(\"Value: \" + e.getValue()));\n        add(news); add(a); add(b); add(scroll); add(value);\n        addWindowListener(new WindowAdapter(){\n            public void windowClosing(WindowEvent e){ dispose(); }\n        });\n        setSize(370, 210); setVisible(true);\n    }\n    public static void main(String[] args){ new SelectControlsDemo(); }\n}","output":"Checkbox News is checked; group A selected; moving slider updates Value label.","flow":"User toggles/checks/drags → ItemEvent / AdjustmentEvent → listener → Update controls","recap":"Checkbox independent; CheckboxGroup single-choice; Scrollbar is an adjustable numeric slider.","tip":""},{"id":"B45","part":"B","number":45,"marks":10,"question":"Explain the paint() and update() methods in applet programming with examples.","topic":"Applets & AWT","definition":"paint(Graphics) draws an AWT component; update(Graphics) is invoked during repaint and commonly prepares the surface before calling paint().","points":["Override public void paint(Graphics g) to draw text, lines, shapes and colors.","g.drawString(), drawLine(), drawRect(), fillOval() are common Graphics methods.","repaint() schedules an update request asynchronously; it does not paint immediately in the caller.","The classic Component.update(g) clears the background and delegates to paint(g), which can cause flicker.","Override update(g) carefully only when custom redraw behavior is needed; calling paint(g) directly in update avoids background clearing but does not ensure every drawing strategy is flicker-free.","Modern double buffering is preferred for smooth animation, but the syllabus emphasizes paint/update."],"syntax":"public void paint(Graphics g){ g.drawString(\"Java\", 20, 20); }\npublic void update(Graphics g){ paint(g); }","code":"import java.applet.Applet;\nimport java.awt.*;\npublic class PaintUpdateDemo extends Applet {\n    @Override public void init(){\n        setBackground(Color.WHITE);\n    }\n    @Override public void paint(Graphics g){\n        g.setColor(Color.BLUE);\n        g.drawString(\"Java Graphics\", 25, 35);\n        g.drawRect(20, 50, 130, 50);\n    }\n    @Override public void update(Graphics g){\n        paint(g); // custom update: skip default clear\n    }\n}\n// Legacy applet example for prescribed exam syllabus.","output":"Graphical output: blue Java Graphics text and an outlined rectangle.","flow":"repaint() request → update(Graphics) → paint(Graphics) → drawString()/drawRect()","recap":"paint = draw; update = prepare/repaint path; repaint = request redraw.","tip":""}];
</script>

function ico(name){return `<svg viewBox="0 0 24 24" aria-hidden="true">${icons[name]||icons.spark}</svg>`}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function readStorage(){try{const raw=localStorage.getItem(KEY);const d=raw?JSON.parse(raw):{};return {bookmarks:Array.isArray(d.bookmarks)?d.bookmarks:[],mastered:Array.isArray(d.mastered)?d.mastered:[],review:Array.isArray(d.review)?d.review:[],last:d.last||'',fontScale:d.fontScale||1}}catch{return {bookmarks:[],mastered:[],review:[],last:'',fontScale:1}}}

function isSaved(q){return progress.bookmarks.includes(q.id)}

function pct(part){let arr=part==='All'?bank:bank.filter(q=>q.part===part);return arr.length?Math.round(arr.filter(q=>progress.mastered.includes(q.id)).length*100/arr.length):0}
function countLearned(part){return bank.filter(q=>(part==='All'||q.part===part)&&isMastered(q)).length}
function progressBar(part){return `<div class="progress-rail"><div class="progress-fill" style="width:${pct(part)}%"></div></div><div class="progress-label">${countLearned(part)} of ${part==='All'?90:45} mastered · ${pct(part)}%</div>`}

function flowHtml(s){
 if(!s)return '';
 // The syllabus contains both trees (Collections/AWT) and state-transition charts.
 // Preserve tree indentation rather than flattening it into a single node.
 if(/[├└]─/.test(s))return `<div class="flow-tree"><pre>${esc(s)}</pre></div>`;
 if(s.includes('NEW --start()-->')){
  const lines=s.split('\n').map(x=>x.trim()).filter(Boolean);
  return `<div class="flow-lanes"><div class="flow"><span class="flow-node">NEW</span><span class="transition"><small>start()</small>→</span><span class="flow-node">RUNNABLE</span><span class="transition"><small>run() finishes</small>→</span><span class="flow-node">TERMINATED</span></div>${lines.slice(1).map(l=>{const m=l.match(/^RUNNABLE\s+↔\s+(\w+)\s*(.*)$/);return m?`<div class="flow"><span class="flow-node">RUNNABLE</span><span class="transition"><small>${esc(m[2].replace(/[()]/g,''))}</small>↔</span><span class="flow-node">${esc(m[1])}</span></div>`:''}).join('')}</div>`;
 }
 const lines=s.includes('\n')?s.split('\n').filter(x=>x.trim()):s.split(/\s+\|\s+/).filter(Boolean);
 return `<div class="flow-lanes">${lines.map(line=>{
   const sections=line.trim().split(/\s*(?:→|↔|->)\s*/).filter(Boolean);
   if(sections.length===1)return `<div class="flow"><div class="flow-node" style="max-width:min(100%,650px);text-align:left;white-space:pre-wrap">${esc(line.trim())}</div></div>`;
   return `<div class="flow">${sections.map((v,i)=>`${i?`<span class="flow-arrow">${line.includes('↔')?'↔':'→'}</span>`:''}<div class="flow-node">${esc(v)}</div>`).join('')}</div>`;
 }).join('')}</div>`;
}

function modifyDone(id){const v=toggleField('mastered',id);if(v){const idx=progress.review.indexOf(id);if(idx>=0)progress.review.splice(idx,1);persist()}return v}
function copyText(text){if(navigator.clipboard&&window.isSecureContext){return navigator.clipboard.writeText(text)}return new Promise((resolve,reject)=>{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();let ok=false;try{ok=document.execCommand('copy')}catch{}ta.remove();ok?resolve():reject(Error('Copy unsupported'))})}
async function handle(action,btn){const id=btn.dataset.id;const q=id?byId.get(id):null;switch(action){case 'go':go(btn.dataset.view);break;case 'open':if(q)go('question',id);break;case 'open-part':state.part=btn.dataset.part;state.topic='All';state.filter='all';state.search='';go('library');break;case 'part':state.part=btn.dataset.part;state.scrollPending=false;render();break;case 'filter':state.filter=btn.dataset.filter;state.scrollPending=false;render();break;case 'rev-part':state.revPart=btn.dataset.part;state.scrollPending=false;render();break;case 'clear-filters':state.part='All';state.topic='All';state.filter='all';state.search='';state.scrollPending=false;render();break;case 'open-search':state.part='All';state.topic='All';state.filter='all';go('library');setTimeout(()=>document.getElementById('bank-search')?.focus(),90);break;case 'open-filter':state.filter=btn.dataset.filter;state.part='All';state.topic='All';state.search='';go('library');break;case 'bookmark':if(q){const was=toggleField('bookmarks',id);toast(was?'Question bookmarked':'Bookmark removed');state.scrollPending=false;render()}break;case 'master':if(q){const was=modifyDone(id);toast(was?'Question marked mastered':'Mastery mark removed');state.scrollPending=false;render()}break;case 'review':if(q){const was=toggleField('review',id);toast(was?'Added to revision queue':'Removed from revision queue');state.scrollPending=false;render()}break;case 'copy':if(q){const str=btn.dataset.code==='syntax'?q.syntax:q.code;try{await copyText(str);toast('Copied to clipboard')}catch{toast('Select and copy the text manually')}}break;case 'print':window.print();break;case 'start-quiz':startQuiz(btn.dataset.part||'All');break;case 'start-mock':startMock();break;case 'reveal':if(state.quiz){state.quiz.revealed=true;state.scrollPending=false;render()}break;case 'quiz-again':if(state.quiz){let rq=state.quiz.ids[state.quiz.idx];if(!progress.review.includes(rq))progress.review.push(rq);persist();state.quiz.review++;state.quiz.idx++;state.quiz.revealed=false;state.scrollPending=true;render()}break;case 'quiz-known':if(state.quiz){let rq=state.quiz.ids[state.quiz.idx];if(!progress.mastered.includes(rq))progress.mastered.push(rq);let ri=progress.review.indexOf(rq);if(ri>=0)progress.review.splice(ri,1);persist();state.quiz.known++;state.quiz.idx++;state.quiz.revealed=false;state.scrollPending=true;render()}break;case 'stop-quiz':state.quiz=null;go('practice');break;case 'font':progress.fontScale=Number(btn.dataset.scale);persist();state.scrollPending=false;render();break;case 'reset':if(confirm('Erase all bookmarks, mastery marks and revision queues on this device?')){progress={bookmarks:[],mastered:[],review:[],last:'',fontScale:1};persist();state.scrollPending=false;render();toast('Study progress reset')}break;case 'timer-toggle':if(!state.timerRunning){state.timerEnd=Date.now()+state.timerLeft*1000;state.timerRunning=true}else{state.timerLeft=Math.max(0,Math.ceil((state.timerEnd-Date.now())/1000));state.timerRunning=false}state.scrollPending=false;render();break;case 'timer-reset':state.timerRunning=false;state.timerLeft=10800;state.timerEnd=0;state.scrollPending=false;render();break;}}
document.addEventListener('click',evt=>{const b=evt.target.closest('[data-action]');if(!b)return;evt.preventDefault();evt.stopPropagation();handle(b.dataset.action,b)});
document.addEventListener('keydown',evt=>{if((evt.key==='Enter'||evt.key===' ')&&evt.target?.matches('[role="button"][data-action]')){evt.preventDefault();handle(evt.target.dataset.action,evt.target)}if((evt.ctrlKey||evt.metaKey)&&evt.key.toLowerCase()==='k'){evt.preventDefault();go('library');document.getElementById('bank-search')?.focus()}if(evt.key==='Escape'&&state.view==='question'){go('library')}});
document.addEventListener('input',evt=>{if(evt.target?.id==='bank-search'){const focus=evt.target,at=focus.selectionStart;state.search=focus.value;state.scrollPending=false;render();const next=document.getElementById('bank-search');next?.focus();if(at!==null)try{next.setSelectionRange(at,at)}catch{}}});
document.addEventListener('change',evt=>{const t=evt.target;if(t?.id==='topic-filter'){state.topic=t.value;state.scrollPending=false;render()}if(t?.id==='rev-topic-filter'){state.revTopic=t.value;state.scrollPending=false;render()}if(t?.dataset?.mockChoice){const id=t.dataset.mockChoice;const idx=state.mockChoices.indexOf(id);if(t.checked&&idx<0&&state.mockChoices.length<5)state.mockChoices.push(id);if(!t.checked&&idx>=0)state.mockChoices.splice(idx,1);const counter=document.getElementById('choice-counter');if(counter)counter.textContent=state.mockChoices.length+'/5';document.querySelectorAll('input[data-mock-choice]').forEach(box=>{box.disabled=state.mockChoices.length>=5&&!state.mockChoices.includes(box.dataset.mockChoice)})}});
window.addEventListener('hashchange',parseHash);
setInterval(()=>{if(!state.timerRunning)return;state.timerLeft=Math.max(0,Math.ceil((state.timerEnd-Date.now())/1000));const text=document.getElementById('timer-display');if(text)text.textContent=mmss(state.timerLeft);if(state.timerLeft===0){state.timerRunning=false;toast('Three-hour practice time completed');if(state.view==='mock'){state.scrollPending=false;render()}}},500);
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
setFont();parseHash();const splash=document.getElementById('splash');setTimeout(()=>splash.classList.add('dismiss'),440);
})();
</script>
</body>
</html>
