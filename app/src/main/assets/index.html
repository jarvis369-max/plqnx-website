  <style>:root{--bg:#fff8f3;--paper:#fffdfb;--paper2:#fff4eb;--ink:#4d3333;--muted:#947d78;--coral:#db795f;--coral2:#ec967c;--peach:#ffd7c3;--line:#f0ddd4;--shadow:0 16px 44px rgba(164,90,73,.092);--shadow-lg:0 28px 75px rgba(158,84,65,.15);--radius:24px;--font-scale:1;--sidebar:246px}

  <script>/* Embedded exam content: available with no network or account. */
window.PLQNX_BANK = [{"id":"A01","part":"A","number":1,"marks":3,"question":"List any three features of Object-Oriented Programming.","topic":"OOP","definition":"Object-Oriented Programming (OOP) organizes software around objects containing data and methods.","points":["Encapsulation: combine fields and methods in a class and control access to data.","Inheritance: derive a new class from an existing class and reuse behavior.","Polymorphism: the same method call can behave differently on different objects.","Abstraction: expose essential operations and hide implementation details."],"syntax":"class Student { private int age; public int getAge(){ return age; } }","code":"","output":"","flow":"Class definition → Object creation → Methods operate on object state","recap":"Remember EIPA: Encapsulation, Inheritance, Polymorphism, Abstraction.","tip":""},{"id":"A02","part":"A","number":2,"marks":3,"question":"Differentiate between Procedure-Oriented Programming and Object-Oriented Programming.","topic":"OOP","definition":"Procedure-Oriented Programming (POP) focuses on functions; OOP focuses on objects and classes.","points":["POP: program is divided into functions; OOP: program is divided into classes/objects.","POP: data is typically passed among functions; OOP: data and methods can be encapsulated together.","POP: top-down design is common; OOP: bottom-up modeling is common.","POP: reuse mainly through functions; OOP: also supports inheritance and polymorphism."],"syntax":"POP: function(data);    OOP: object.method();","code":"","output":"","flow":"Problem → Functions (POP) | Problem → Classes → Objects (OOP)","recap":"POP groups functions; OOP groups state and behavior in objects.","tip":""},{"id":"A03","part":"A","number":3,"marks":3,"question":"List the important features of Java.","topic":"OOP","definition":"Java is a high-level, class-based, object-oriented language designed for portability and reliability.","points":["Simple and familiar syntax; object-oriented organization.","Platform independent at bytecode level using the JVM (write once, run where a compatible JVM exists).","Robust with exception handling, garbage collection, and type checking.","Secure-by-design features, multithreading, portability and networking support."],"syntax":"javac Hello.java\njava Hello","code":"","output":"","flow":"Source (.java) → javac → Bytecode (.class) → JVM → Output","recap":"Java source is compiled to bytecode; the JVM executes it.","tip":""},{"id":"A04","part":"A","number":4,"marks":3,"question":"Differentiate between an abstract class and an interface.","topic":"OOP","definition":"An abstract class is an incomplete base class; an interface specifies a contract that implementing classes follow.","points":["Abstract class: extends one class; interface: a class may implement multiple interfaces.","Abstract class: may contain instance fields, constructors, concrete and abstract methods; interface: fields are implicitly public static final, with abstract/default/static methods and other modern methods.","Abstract class: use for shared state/partial implementation; interface: use for capabilities across unrelated classes."],"syntax":"abstract class Shape { abstract void draw(); }\ninterface Printable { void print(); }","code":"","output":"","flow":"Shared implementation? → Abstract class | Shared capability contract? → Interface","recap":"Use abstract class for common state; use interface for a common contract.","tip":""},{"id":"A05","part":"A","number":5,"marks":3,"question":"What is method overloading? Give an example.","topic":"OOP","definition":"Method overloading means defining multiple methods with the same name but different parameter lists in one class.","points":["Parameters must differ in number, type, or order.","It is compile-time polymorphism.","Changing only the return type does not overload a method."],"syntax":"int add(int a, int b) { return a+b; }\ndouble add(double a, double b) { return a+b; }","code":"","output":"","flow":"","recap":"Overloading = same method name, different parameters.","tip":""},{"id":"A06","part":"A","number":6,"marks":3,"question":"What is method overriding? Give an example.","topic":"OOP","definition":"Method overriding happens when a subclass provides its own implementation of an inherited, overridable instance method.","points":["Method name and parameter types match the superclass method; return type must be compatible.","Resolved at runtime for the actual object (runtime polymorphism).","The @Override annotation helps the compiler detect mistakes; static and private methods are not overridden."],"syntax":"class A { void show(){ System.out.println(\"A\"); } }\nclass B extends A { @Override void show(){ System.out.println(\"B\"); } }","code":"","output":"","flow":"","recap":"Overriding = subclass changes an inherited instance method.","tip":""},{"id":"A07","part":"A","number":7,"marks":3,"question":"List the different types of inheritance supported in Java.","topic":"OOP","definition":"Inheritance allows a class to acquire accessible properties and behaviors from another class.","points":["Java class inheritance supports single, multilevel and hierarchical forms.","Multiple inheritance of classes is not supported.","Multiple type inheritance is possible by implementing more than one interface; hybrid patterns can combine these forms."],"syntax":"class Dog extends Animal {}\nclass SmartDog extends Dog {}","code":"","output":"","flow":"Single: A → B | Multilevel: A → B → C | Hierarchical: A → B and A → C","recap":"Class inheritance: single, multilevel, hierarchical; multiple via interfaces.","tip":""},{"id":"A08","part":"A","number":8,"marks":3,"question":"What is multilevel inheritance?","topic":"OOP","definition":"Multilevel inheritance is an inheritance chain in which one subclass becomes the superclass of another.","points":["Example: Animal → Mammal → Dog.","The last subclass can inherit accessible members from all its ancestors.","The extends keyword creates each link."],"syntax":"class Animal {}\nclass Mammal extends Animal {}\nclass Dog extends Mammal {}","code":"","output":"","flow":"Animal → Mammal → Dog","recap":"Multilevel = inheritance across three or more levels.","tip":""},{"id":"A09","part":"A","number":9,"marks":3,"question":"What is the use of the super keyword in Java?","topic":"OOP","definition":"The super keyword refers to the immediate superclass portion of the current object.","points":["super.field accesses a hidden superclass field.","super.method() calls an accessible overridden superclass method.","super(...) calls the superclass constructor and must be the first constructor statement."],"syntax":"super();\nsuper.display();\nSystem.out.println(super.count);","code":"","output":"","flow":"Subclass method → super.method() → Parent method","recap":"super accesses a parent constructor, field or method.","tip":""},{"id":"A10","part":"A","number":10,"marks":3,"question":"List the access modifiers in Java.","topic":"OOP","definition":"Access modifiers control visibility of classes, fields, constructors, and methods.","points":["public: available anywhere accessible.","protected: available in its package and to subclasses under Java access rules.","no modifier (package-private): available within the same package.","private: available within the enclosing class."],"syntax":"public int a;\nprotected int b;\nint c; // package-private\nprivate int d;","code":"","output":"","flow":"","recap":"Visibility from broadest to narrowest: public, protected, package-private, private.","tip":""},{"id":"A11","part":"A","number":11,"marks":3,"question":"What are the advantages of using interfaces in Java?","topic":"OOP","definition":"An interface declares operations that implementing classes promise to provide.","points":["Supports abstraction: clients depend on a contract rather than concrete implementation.","Allows multiple inheritance of type using implements A, B.","Promotes loose coupling, interchangeable implementations, testing and code maintenance."],"syntax":"interface Flyable { void fly(); }\nclass Bird implements Flyable { public void fly() {} }","code":"","output":"","flow":"","recap":"Interface = reusable contract + multiple-type implementation.","tip":""},{"id":"A12","part":"A","number":12,"marks":3,"question":"How do you create a package in Java?","topic":"Packages & I/O","definition":"A package is a namespace used to organize Java classes and avoid naming conflicts.","points":["Put the package statement at the beginning of the source file (after comments).","Store compiled classes in matching directories by using javac -d.","Access a class by importing its package or using its fully-qualified name."],"syntax":"package mypack;\npublic class Demo {}\n// javac -d . Demo.java","code":"","output":"","flow":"package declaration → javac -d . → mypack/Demo.class","recap":"package mypack; declares the package; javac -d generates its folder layout.","tip":""},{"id":"A13","part":"A","number":13,"marks":3,"question":"How do you import a package in Java? Explain the different ways.","topic":"Packages & I/O","definition":"The import statement lets Java source use types from other packages by simple name.","points":["Import one type: import java.util.Scanner;","Import all accessible types in a package: import java.util.*; (not subpackages).","Use static imports for static members: import static java.lang.Math.PI;","No import is needed for java.lang or if using a fully-qualified name."],"syntax":"import java.util.Scanner;\nimport java.util.*;\nimport static java.lang.Math.PI;","code":"","output":"","flow":"","recap":"Use a single-type import, on-demand import or static import.","tip":""},{"id":"A14","part":"A","number":14,"marks":3,"question":"How do you set the classpath in Java?","topic":"Packages & I/O","definition":"Classpath tells Java tools where to look for user-defined classes and dependencies.","points":["Use -cp (or -classpath) when compiling or running classes.","Separate entries with ; on Windows and : on Linux/macOS.","Include the current directory explicitly with . when setting a custom classpath; package folders should match package names."],"syntax":"javac -cp .;lib\\helper.jar Main.java  // Windows\njava -cp .;lib\\helper.jar Main","code":"","output":"","flow":"","recap":"Classpath = search path for class files and libraries; -cp sets it.","tip":""},{"id":"A15","part":"A","number":15,"marks":3,"question":"Differentiate between byte streams and character streams.","topic":"Packages & I/O","definition":"Byte streams read/write 8-bit bytes; character streams read/write Unicode text as characters through a charset.","points":["Byte streams: InputStream/OutputStream; suitable for images, binary files, raw data.","Character streams: Reader/Writer; suitable for text with encoding/decoding.","Example byte classes FileInputStream/FileOutputStream; character classes FileReader/FileWriter."],"syntax":"new FileInputStream(\"image.bin\");\nnew FileReader(\"notes.txt\");","code":"","output":"","flow":"Binary file → InputStream | Text file → Reader (charset decoding)","recap":"Binary → byte streams; text → character streams.","tip":""},{"id":"A16","part":"A","number":16,"marks":3,"question":"List the different types of I/O streams in Java.","topic":"Packages & I/O","definition":"Java I/O streams are sequences used to read data from a source or write data to a destination.","points":["Byte input: InputStream; byte output: OutputStream.","Character input: Reader; character output: Writer.","Buffered, data, object and file streams extend these categories for specific tasks."],"syntax":"InputStream in; OutputStream out;\nReader reader; Writer writer;","code":"","output":"","flow":"I/O → Byte (InputStream/OutputStream) | Character (Reader/Writer)","recap":"Four principal base types: InputStream, OutputStream, Reader, Writer.","tip":""},{"id":"A17","part":"A","number":17,"marks":3,"question":"What are file streams? Name the important file stream classes.","topic":"Packages & I/O","definition":"File streams are classes that connect a Java program to files for reading or writing.","points":["FileInputStream and FileOutputStream handle byte data.","FileReader and FileWriter handle text characters.","BufferedInputStream/BufferedOutputStream and BufferedReader/BufferedWriter improve I/O efficiency; close resources with try-with-resources."],"syntax":"try (FileInputStream in = new FileInputStream(\"a.dat\")) { int b = in.read(); }","code":"","output":"","flow":"","recap":"FileInputStream/FileOutputStream: bytes; FileReader/FileWriter: text.","tip":""},{"id":"A18","part":"A","number":18,"marks":3,"question":"Differentiate between ArrayList and LinkedList.","topic":"Collections","definition":"ArrayList and LinkedList are List implementations preserving insertion order and allowing duplicates.","points":["ArrayList uses a resizable array; LinkedList uses a doubly linked list.","ArrayList offers fast indexed access (typically O(1)); LinkedList indexed access is O(n).","LinkedList supports efficient insertion/removal at ends (once located); ArrayList is usually preferable for most read-heavy lists."],"syntax":"List<String> a = new ArrayList<>();\nList<String> b = new LinkedList<>();","code":"","output":"","flow":"","recap":"ArrayList = dynamic array; LinkedList = linked nodes.","tip":""},{"id":"A19","part":"A","number":19,"marks":3,"question":"Differentiate between List and Set.","topic":"Collections","definition":"List and Set are interfaces in the Java Collections Framework.","points":["List preserves positional order and permits duplicates; Set does not permit duplicate elements.","List supports indexed access with get(index); Set does not define indexed access.","Examples: ArrayList, LinkedList (List); HashSet, LinkedHashSet, TreeSet (Set)."],"syntax":"List<Integer> a = Arrays.asList(1,1);\nSet<Integer> b = new HashSet<>(a); // one 1","code":"","output":"","flow":"","recap":"List permits duplicates; Set stores unique elements.","tip":""},{"id":"A20","part":"A","number":20,"marks":3,"question":"Explain the Java Collections Framework hierarchy.","topic":"Collections","definition":"The Java Collections Framework provides standard interfaces and implementations to store and process groups of objects.","points":["Collection extends Iterable and branches into List, Set and Queue; Deque extends Queue.","List → ArrayList, LinkedList; Set → HashSet, LinkedHashSet, TreeSet; Queue/Deque → PriorityQueue, ArrayDeque.","Map → HashMap, LinkedHashMap, TreeMap is a separate interface, not a subtype of Collection."],"syntax":"Collection<E> → List<E>, Set<E>, Queue<E>\nMap<K,V> // separate hierarchy","code":"","output":"","flow":"Iterable → Collection → List / Set / Queue → Deque | Map (separate)","recap":"Collection includes List/Set/Queue; Map is separate.","tip":""},{"id":"A21","part":"A","number":21,"marks":3,"question":"List any three methods of the ArrayList class.","topic":"Collections","definition":"ArrayList is a resizable-array List implementation in java.util.","points":["add(E element): appends an element.","get(int index): retrieves an element at a position.","remove(int index) or remove(Object): deletes an element.","set(int index,E e), size() and contains(Object) are also common."],"syntax":"list.add(\"Java\");\nlist.get(0);\nlist.remove(0);","code":"","output":"","flow":"","recap":"Three essential ArrayList methods: add(), get(), remove().","tip":""},{"id":"A22","part":"A","number":22,"marks":3,"question":"What is an Iterator? List its important methods.","topic":"Collections","definition":"An Iterator is an object that traverses elements in a collection sequentially.","points":["hasNext(): checks whether another element exists.","next(): returns the next element and advances the cursor.","remove(): optional operation removes the last element returned by next(); supported by many mutable collection iterators."],"syntax":"Iterator<String> it = list.iterator();\nwhile(it.hasNext()) System.out.println(it.next());","code":"","output":"","flow":"iterator() → hasNext()? → next() → repeat → End","recap":"Iterator core methods: hasNext(), next(), optional remove().","tip":""},{"id":"A23","part":"A","number":23,"marks":3,"question":"Differentiate between collections and streams.","topic":"Collections","definition":"A collection stores elements; a Java Stream represents a pipeline of operations over elements.","points":["Collection: reusable in-memory data structure; Stream: generally single-use processing pipeline.","Collection provides add/remove/access; Stream provides filter/map/reduce/collect.","A Stream normally does not store elements; it reads from sources such as collections or arrays."],"syntax":"List<Integer> numbers = List.of(1,2,3);\nlong n = numbers.stream().filter(x -> x>1).count();","code":"","output":"","flow":"Collection (source) → Stream operations → Result","recap":"Collection holds data; Stream processes data.","tip":""},{"id":"A24","part":"A","number":24,"marks":3,"question":"What is exception handling? State its advantages.","topic":"Exceptions","definition":"Exception handling is a mechanism for responding to abnormal conditions at runtime without abruptly ending all program logic.","points":["try identifies risky code; catch handles matching exceptions; finally performs cleanup.","Helps separate normal logic from error handling.","Supports meaningful messages and resource cleanup; checked exceptions can be propagated using throws."],"syntax":"try { int x=10/0; } catch(ArithmeticException e) { System.out.println(\"Invalid division\"); }","code":"","output":"","flow":"try → Exception? → catch → finally → Continue","recap":"try/catch/finally control runtime error handling.","tip":""},{"id":"A25","part":"A","number":25,"marks":3,"question":"List the different types of exceptions in Java.","topic":"Exceptions","definition":"Java Throwable has two main branches: Error and Exception; exceptions include checked and unchecked types.","points":["Checked exceptions are compiler-enforced, e.g., IOException and FileNotFoundException.","Unchecked exceptions are RuntimeException subclasses, e.g., NullPointerException and ArithmeticException.","Errors such as OutOfMemoryError typically indicate severe JVM/environment conditions, not routine application exceptions."],"syntax":"Throwable → Error | Exception → RuntimeException (unchecked) / other checked exceptions","code":"","output":"","flow":"","recap":"Exceptions: checked and unchecked; Errors are a separate Throwable branch.","tip":""},{"id":"A26","part":"A","number":26,"marks":3,"question":"Differentiate between checked and unchecked exceptions.","topic":"Exceptions","definition":"Checked exceptions are checked by the compiler; unchecked exceptions are not.","points":["Checked: e.g., IOException; must be caught or declared with throws.","Unchecked: RuntimeException and subclasses such as NullPointerException; no mandatory catch/throws.","Checked often represent recoverable external conditions; unchecked often represent programming errors or invalid use."],"syntax":"void read() throws IOException { /* file I/O */ }","code":"","output":"","flow":"","recap":"Checked → handle/declare; unchecked → no mandatory declaration.","tip":""},{"id":"A27","part":"A","number":27,"marks":3,"question":"What is the purpose of the throw keyword?","topic":"Exceptions","definition":"throw explicitly raises one exception object at a chosen point in program execution.","points":["Write throw followed by a Throwable object expression.","Use to report invalid input or broken preconditions.","It transfers control to a matching catch handler, or propagates up the call stack."],"syntax":"if(age < 0) throw new IllegalArgumentException(\"Age must be positive\");","code":"","output":"","flow":"Validate input → Invalid? → throw exception → catch/propagate","recap":"throw raises an actual exception instance.","tip":""},{"id":"A28","part":"A","number":28,"marks":3,"question":"What is the purpose of the throws keyword?","topic":"Exceptions","definition":"throws declares possible exception types in a method or constructor signature.","points":["Placed after the parameter list and before the method body.","Informs callers of checked exceptions they must handle or declare.","It does not itself create or throw an exception."],"syntax":"static void read() throws java.io.IOException { /* code */ }","code":"","output":"","flow":"","recap":"throws declares; throw raises.","tip":""},{"id":"A29","part":"A","number":29,"marks":3,"question":"What is a multi-catch block?","topic":"Exceptions","definition":"A multi-catch block catches different exception types using one handler body (Java 7+).","points":["Separate exception alternatives using | (vertical bar).","Catch variable is implicitly final and shared by the alternatives.","Alternatives cannot be related as subtype and supertype in the same multi-catch."],"syntax":"catch (IOException | NumberFormatException e) { System.out.println(e.getMessage()); }","code":"","output":"","flow":"","recap":"Multi-catch: catch (TypeA | TypeB e) { ... }.","tip":""},{"id":"A30","part":"A","number":30,"marks":3,"question":"List the different sources of errors in Java.","topic":"Exceptions","definition":"Errors can arise at writing, compiling, running or evaluating a Java program.","points":["Syntax/compile-time errors: missing semicolon, wrong type or undefined identifier.","Runtime errors/exceptions: division by zero, invalid array index, file not found.","Logical errors: program compiles and runs but produces the wrong result due to incorrect logic."],"syntax":"int x = 5 // compile-time: missing ;\nint y = 5/0; // runtime exception","code":"","output":"","flow":"Source → Compile errors? → Runtime errors? → Logic validation","recap":"Three practical categories: syntax, runtime, logical errors.","tip":""},{"id":"A31","part":"A","number":31,"marks":3,"question":"List the different states in the life cycle of a thread.","topic":"Threads","definition":"A Java Thread moves among states defined by Thread.State during its lifetime.","points":["NEW: Thread object created, start() not called.","RUNNABLE: eligible to run (includes running on the CPU in the Java API state model).","BLOCKED: waiting for a monitor lock; WAITING/TIMED_WAITING: waiting indefinitely/for a time.","TERMINATED: run() has finished."],"syntax":"Thread t = new Thread(() -> {}); // NEW\nt.start(); // RUNNABLE","code":"","output":"","flow":"NEW → RUNNABLE ↔ BLOCKED / WAITING / TIMED_WAITING → TERMINATED","recap":"Six Java Thread.State values: NEW, RUNNABLE, BLOCKED, WAITING, TIMED_WAITING, TERMINATED.","tip":""},{"id":"A32","part":"A","number":32,"marks":3,"question":"What are thread priorities? List the priority levels.","topic":"Threads","definition":"Thread priority is a scheduling hint represented by an integer in Java.","points":["MIN_PRIORITY = 1, NORM_PRIORITY = 5, MAX_PRIORITY = 10.","setPriority(int) sets; getPriority() retrieves.","Scheduling order is platform-dependent; high priority does not guarantee first execution."],"syntax":"Thread t = new Thread();\nt.setPriority(Thread.MAX_PRIORITY);","code":"","output":"","flow":"","recap":"Priority levels: 1 (MIN), 5 (NORM), 10 (MAX).","tip":""},{"id":"A33","part":"A","number":33,"marks":3,"question":"Differentiate between extending the Thread class and implementing the Runnable interface.","topic":"Threads","definition":"Java threads can be created by extending Thread or implementing Runnable.","points":["extends Thread: override run(), instantiate and call start(); inherits Thread and cannot extend another class.","implements Runnable: implement run(), pass an instance to new Thread(r), then call start().","Runnable separates task from thread control and allows the task class to extend another class."],"syntax":"class A extends Thread { public void run() {} }\nclass B implements Runnable { public void run() {} }","code":"","output":"","flow":"","recap":"Runnable is usually more flexible; both need Thread.start() to run concurrently.","tip":""},{"id":"A34","part":"A","number":34,"marks":3,"question":"What is synchronization in multithreading?","topic":"Threads","definition":"Synchronization controls concurrent access to shared mutable state so operations occur safely.","points":["synchronized gives a thread exclusive ownership of an object monitor while executing a protected block/method.","Prevents race conditions when multiple threads modify shared data.","Protect short, relevant critical sections; improper locking may cause deadlocks."],"syntax":"synchronized void increment() { count++; }","code":"","output":"","flow":"Thread A/B → Acquire same lock → Critical section → Release lock","recap":"Synchronization protects shared data using a monitor lock.","tip":""},{"id":"A35","part":"A","number":35,"marks":3,"question":"What is an applet? State its features.","topic":"Applets & AWT","definition":"An applet is a legacy Java program historically embedded in an HTML page and executed by an applet viewer or browser plugin.","points":["Typically extends java.applet.Applet and uses AWT to draw a GUI.","Has lifecycle methods init(), start(), stop(), destroy(); paint(Graphics) performs drawing.","Modern browsers no longer support Java applets; study them for the prescribed syllabus, not new deployments."],"syntax":"public class Demo extends java.applet.Applet { public void paint(java.awt.Graphics g) { g.drawString(\"Hi\",20,20); } }","code":"","output":"","flow":"","recap":"Applet = legacy embedded Java GUI with lifecycle callbacks.","tip":""},{"id":"A36","part":"A","number":36,"marks":3,"question":"List the methods in the applet life cycle.","topic":"Applets & AWT","definition":"Applet lifecycle methods are callbacks called by the applet container during loading, activity and unloading.","points":["init() runs once to initialize resources.","start() runs when the applet becomes active; stop() runs when inactive.","destroy() runs before final removal; paint(Graphics) draws when repainting is required."],"syntax":"public void init() {}\npublic void start() {}\npublic void stop() {}\npublic void destroy() {}","code":"","output":"","flow":"init() → start() → paint() ↔ stop() → destroy()","recap":"Core lifecycle: init, start, stop, destroy; paint is a rendering callback.","tip":""},{"id":"A37","part":"A","number":37,"marks":3,"question":"What is the purpose of the init(), start(), stop() and destroy() methods?","topic":"Applets & AWT","definition":"The four methods manage the stages of an applet from initialization to removal.","points":["init(): initialize controls and data once.","start(): start or resume work whenever activated.","stop(): pause work whenever inactive.","destroy(): release resources before unloading."],"syntax":"init() → start() → stop() → [start() again] → destroy()","code":"","output":"","flow":"Load → init → start → stop → start (optional) → destroy","recap":"init once; start/stop can repeat; destroy at the end.","tip":""},{"id":"A38","part":"A","number":38,"marks":3,"question":"What is an event in Java? List different types of events.","topic":"Applets & AWT","definition":"An event is an object describing a user or system action that a program may respond to.","points":["ActionEvent: button press or action command.","MouseEvent: click, press, release, enter, exit, move, drag.","KeyEvent: key pressed, released or typed.","ItemEvent, WindowEvent and AdjustmentEvent represent selections, window activity and scrollbar changes."],"syntax":"button.addActionListener(e -> System.out.println(\"Clicked\"));","code":"","output":"","flow":"User action → Event source → Event object → Listener callback","recap":"Event = occurrence; listener = code handling the occurrence.","tip":""},{"id":"A39","part":"A","number":39,"marks":3,"question":"Name the important event classes in Java.","topic":"Applets & AWT","definition":"Java AWT events are represented by subclasses of java.awt.AWTEvent.","points":["ActionEvent (button); ItemEvent (checkbox/choice); AdjustmentEvent (scrollbar).","MouseEvent and KeyEvent (pointer and keyboard input).","WindowEvent, FocusEvent, ComponentEvent, TextEvent (window, focus, component, text changes)."],"syntax":"import java.awt.event.*;","code":"","output":"","flow":"","recap":"Key event classes: ActionEvent, ItemEvent, MouseEvent, KeyEvent, WindowEvent.","tip":""},{"id":"A40","part":"A","number":40,"marks":3,"question":"What are mouse events? Name the mouse event methods.","topic":"Applets & AWT","definition":"Mouse events report pointer activity over a GUI component.","points":["MouseListener declares mouseClicked, mousePressed, mouseReleased, mouseEntered, mouseExited.","MouseMotionListener declares mouseMoved and mouseDragged.","MouseEvent provides getX(), getY() and getButton() to inspect the interaction."],"syntax":"public void mouseClicked(MouseEvent e) { System.out.println(e.getX()); }","code":"","output":"","flow":"Mouse input → MouseEvent → MouseListener/MouseMotionListener","recap":"Five MouseListener methods + two MouseMotionListener methods.","tip":""},{"id":"A41","part":"A","number":41,"marks":3,"question":"List any six AWT controls used in applet programming.","topic":"Applets & AWT","definition":"AWT controls are UI components from java.awt used in traditional Java GUI and applet programs.","points":["Six controls: Label (text), Button (click), TextField (single-line input).","Checkbox (toggle), Choice (dropdown), List (list selection).","Also useful: TextArea, Scrollbar, CheckboxGroup."],"syntax":"add(new Label(\"Name\"));\nadd(new TextField(12));\nadd(new Button(\"OK\"));","code":"","output":"","flow":"","recap":"Remember Label, Button, TextField, Checkbox, Choice and List.","tip":""},{"id":"A42","part":"A","number":42,"marks":3,"question":"Differentiate between Checkbox and CheckboxGroup.","topic":"Applets & AWT","definition":"Checkbox is an individual on/off control; CheckboxGroup groups checkboxes so only one is selected at once.","points":["Checkbox can be independent and may be checked or unchecked.","CheckboxGroup enables radio-button behavior among Checkboxes assigned to that group.","Checkbox has visible component methods; CheckboxGroup is not itself drawn as a component."],"syntax":"CheckboxGroup g = new CheckboxGroup();\nCheckbox yes = new Checkbox(\"Yes\",g,true);","code":"","output":"","flow":"","recap":"Checkbox = independent toggle; CheckboxGroup = single selection among grouped checkboxes.","tip":""},{"id":"A43","part":"A","number":43,"marks":3,"question":"What is the use of the Scrollbar class? Name its constructors.","topic":"Applets & AWT","definition":"java.awt.Scrollbar lets a user select an integer value by moving a thumb horizontally or vertically.","points":["Constructors: Scrollbar(); Scrollbar(int orientation); Scrollbar(int orientation, int value, int visible, int minimum, int maximum).","Orientations: Scrollbar.HORIZONTAL and Scrollbar.VERTICAL.","AdjustmentListener receives value changes; maximum is an exclusive upper bound for thumb range calculations."],"syntax":"Scrollbar s = new Scrollbar(Scrollbar.HORIZONTAL, 20, 10, 0, 100);","code":"","output":"","flow":"","recap":"Scrollbar provides a value range and supports 0-, 1- and 5-argument constructors.","tip":""},{"id":"A44","part":"A","number":44,"marks":3,"question":"What is the purpose of the paint() and update() methods?","topic":"Applets & AWT","definition":"paint(Graphics) performs drawing; update(Graphics) controls repaint preparation before painting.","points":["paint(Graphics g) is called when drawing is required; override it for custom AWT/Applet graphics.","Component.update(g) normally clears the background and then calls paint(g) in classic AWT, which may cause flicker.","repaint() requests asynchronous update; do not call paint() directly for ordinary redrawing."],"syntax":"public void paint(Graphics g){ g.drawString(\"Hello\", 20, 30); }","code":"","output":"","flow":"repaint() → update(Graphics) → paint(Graphics)","recap":"paint draws; update prepares repaint then delegates to paint.","tip":""},{"id":"A45","part":"A","number":45,"marks":3,"question":"What is the use of the Color class? Name its constructors.","topic":"Applets & AWT","definition":"java.awt.Color stores a color value for AWT drawing and component foreground/background.","points":["Color(int r,int g,int b) sets red, green and blue values from 0 to 255.","Color(int r,int g,int b,int a) adds alpha transparency.","Color(float r,float g,float b) and Color(float r,float g,float b,float a) use components from 0.0 to 1.0; Color(int rgba, boolean hasAlpha) interprets packed integer values."],"syntax":"Color peach = new Color(255, 190, 160);\ng.setColor(peach);","code":"","output":"","flow":"","recap":"Color creates RGB/RGBA color objects used by AWT controls and Graphics.","tip":""},{"id":"B01","part":"B","number":1,"marks":10,"question":"Explain the features of Object-Oriented Programming with suitable examples.","topic":"OOP","definition":"OOP is a programming approach that models a system with interacting objects created from classes.","points":["Class: blueprint defining fields and methods; object: instance carrying state and behavior.","Encapsulation: private fields plus methods protect state and enforce rules.","Abstraction: hide internal details behind public methods or interfaces.","Inheritance: a subclass uses accessible capabilities of its superclass with extends.","Polymorphism: overloading selects by parameters at compile time, while overriding dispatches at runtime.","Benefits include modularity, reuse, testability and maintainability; inheritance must model a genuine is-a relation."],"syntax":"class Child extends Parent { @Override void work(){ ... } }","code":"class Animal {\n    private String name;\n    Animal(String name) { this.name = name; }\n    public String getName() { return name; }\n    void sound() { System.out.println(\"Animal sound\"); }\n}\nclass Dog extends Animal {\n    Dog(String name) { super(name); }\n    @Override void sound() { System.out.println(getName() + \" barks\"); }\n}\npublic class OOPDemo {\n    public static void main(String[] args) {\n        Animal a = new Dog(\"Tommy\");\n        a.sound();\n    }\n}","output":"Tommy barks","flow":"Class Animal → Child Dog → Object new Dog() → overridden sound() executes","recap":"EIPA: Encapsulation, Inheritance, Polymorphism, Abstraction. The code demonstrates encapsulation, inheritance and runtime polymorphism.","tip":"For 10 marks, define each OOP feature, add a labeled relation diagram and explain the sample."},{"id":"B02","part":"B","number":2,"marks":10,"question":"Explain the important features of Java in detail.","topic":"OOP","definition":"Java is a statically typed, object-oriented programming language compiled to bytecode that runs on a compatible JVM.","points":["Simple: familiar syntax, automatic memory management, rich standard libraries.","Object-oriented: class, object, inheritance, interface, polymorphism, abstraction, encapsulation.","Platform-independent execution: javac produces portable bytecode, the OS-specific JVM executes it.","Robust: type checking, exception handling and garbage collection reduce common errors.","Secure features: bytecode verification, access controls and runtime checks; security also depends on code and environment.","Multithreaded: Thread and java.util.concurrent support concurrent activities.","Distributed/network-ready via networking APIs; dynamic loading and performance enhancements via JIT compilation."],"syntax":"javac HelloJava.java\njava HelloJava","code":"public class HelloJava {\n    public static void main(String[] args) {\n        System.out.println(\"Hello, Java!\");\n    }\n}","output":"Hello, Java!","flow":"HelloJava.java → javac → HelloJava.class (bytecode) → JVM/JIT → Console","recap":"Key words: simple, OOP, portable, robust, secure, multithreaded, distributed, high performance.","tip":"Write once, run anywhere means a compatible JVM is required."},{"id":"B03","part":"B","number":3,"marks":10,"question":"Write a Java program to search for an element in an integer array.","topic":"OOP","definition":"Linear search checks an integer array element by element until the target is found or the array ends.","points":["Aim: search for a given integer and report its index.","Algorithm: initialize a flag/index to -1; loop from i=0 to length-1.","At each position compare arr[i] to key; if equal, save index and break.","After the loop, print the found position or not found message.","Time complexity is O(n) worst case; no sorting is needed.","The index is zero-based, so display i+1 if an exam asks for human-readable position."],"syntax":"for (int i=0; i<a.length; i++) { if (a[i] == key) { index=i; break; } }","code":"public class ArraySearch {\n    public static void main(String[] args) {\n        int[] a = {12, 25, 37, 49, 58};\n        int key = 37;\n        int index = -1;\n        for (int i = 0; i < a.length; i++) {\n            if (a[i] == key) {\n                index = i;\n                break;\n            }\n        }\n        if (index >= 0)\n            System.out.println(\"Found at position \" + (index + 1));\n        else\n            System.out.println(\"Element not found\");\n    }\n}","output":"Found at position 3","flow":"Start → Read array/key → i=0 → i < n? → arr[i]==key? → Found / i++ → Not found","recap":"Linear search uses a loop; compare each value; break on match; O(n).","tip":"Trace the index positions 0, 1, 2 to show why position 3 is printed."},{"id":"B04","part":"B","number":4,"marks":10,"question":"Explain method overloading with a suitable Java program.","topic":"OOP","definition":"Method overloading is compile-time polymorphism: two or more methods share a name but differ in parameter type, number or order.","points":["Java chooses the overload using argument types and applicable method signatures at compile time.","Example: add(int,int) and add(double,double) use the same name with different parameter types.","Changing only the return type cannot distinguish overloaded methods.","Constructors can also be overloaded.","Advantage: a single meaningful method name handles related operations.","Contrast: overriding replaces an inherited instance method and uses dynamic dispatch."],"syntax":"returnType methodName(type1 a) { ... }\nreturnType methodName(type2 a, type2 b) { ... }","code":"public class OverloadDemo {\n    static int add(int a, int b) { return a + b; }\n    static double add(double a, double b) { return a + b; }\n    static int add(int a, int b, int c) { return a+b+c; }\n    public static void main(String[] args) {\n        System.out.println(add(2, 3));\n        System.out.println(add(2.5, 3.5));\n        System.out.println(add(1, 2, 3));\n    }\n}","output":"5\n6.0\n6","flow":"Call add(2,3) → int,int overload | add(2.5,3.5) → double,double overload","recap":"Same name + different parameters = overload; compile-time selection.","tip":""},{"id":"B05","part":"B","number":5,"marks":10,"question":"Explain inheritance and its different types with suitable diagrams and examples.","topic":"OOP","definition":"Inheritance allows one Java class to derive accessible members from another, expressing an is-a relationship.","points":["Single inheritance: one child extends one parent (Animal → Dog).","Multilevel: A → B → C forms a chain.","Hierarchical: two or more children inherit the same parent (Animal → Cat and Dog).","Multiple class inheritance (class C extends A, B) is prohibited to avoid conflicting implementation inheritance.","Multiple inheritance of type uses interfaces: class C implements X, Y.","The super keyword accesses the immediate superclass; overriding specializes inherited behavior.","Constructors are not inherited, but the superclass constructor runs during object construction."],"syntax":"class Child extends Parent { }\nclass Child implements First, Second { }","code":"class Animal { void eat(){ System.out.println(\"eats\"); } }\nclass Dog extends Animal { void bark(){ System.out.println(\"barks\"); } }\nclass Puppy extends Dog { void play(){ System.out.println(\"plays\"); } }\ninterface Swimmer { void swim(); }\ninterface Runner { void runFast(); }\nclass Athlete implements Swimmer, Runner {\n    public void swim(){ System.out.println(\"swim\"); }\n    public void runFast(){ System.out.println(\"run\"); }\n}\npublic class InheritanceDemo {\n    public static void main(String[] args) {\n        Puppy p = new Puppy(); p.eat(); p.bark(); p.play();\n        Athlete a = new Athlete(); a.swim(); a.runFast();\n    }\n}","output":"eats\nbarks\nplays\nswim\nrun","flow":"Single: A → B | Multilevel: A → B → C | Hierarchical: A → B and A → C | Interfaces: X, Y → C","recap":"Java class types: single, multilevel, hierarchical; multiple capabilities through interfaces.","tip":""},{"id":"B06","part":"B","number":6,"marks":10,"question":"Write a Java program to demonstrate multilevel inheritance.","topic":"OOP","definition":"Multilevel inheritance forms an inheritance chain so a second-level subclass inherits accessible members from its ancestors.","points":["The base class defines general behavior.","An intermediate subclass extends the base and adds behavior.","A final subclass extends the intermediate class and gains access to inherited methods.","The extends keyword is used at both levels.","An object of the final subclass can call accessible methods of all levels.","Use protected/public methods appropriately rather than accessing private fields directly."],"syntax":"class B extends A {}\nclass C extends B {}","code":"class Grandparent {\n    void house(){ System.out.println(\"Family house\"); }\n}\nclass Parent extends Grandparent {\n    void car(){ System.out.println(\"Family car\"); }\n}\nclass Child extends Parent {\n    void bike(){ System.out.println(\"My bike\"); }\n}\npublic class MultilevelDemo {\n    public static void main(String[] args) {\n        Child c = new Child();\n        c.house(); c.car(); c.bike();\n    }\n}","output":"Family house\nFamily car\nMy bike","flow":"Grandparent → Parent → Child → inherited methods house(), car(), bike()","recap":"Multilevel chain: A extends nothing; B extends A; C extends B.","tip":""},{"id":"B07","part":"B","number":7,"marks":10,"question":"Explain method overriding with a suitable Java program.","topic":"OOP","definition":"Overriding provides a subclass-specific implementation of an accessible, non-final inherited instance method.","points":["The overriding method must have the same name and parameters and a compatible return type.","A subclass cannot reduce visibility of the inherited method.","final methods cannot be overridden; static methods are hidden rather than overridden.","Runtime polymorphism selects the implementation based on the actual object, not the variable type.","@Override provides a compile-time check.","super.method() can call a parent implementation when needed."],"syntax":"@Override public void show() { ... }","code":"class Vehicle {\n    void start(){ System.out.println(\"Vehicle starts\"); }\n}\nclass Bike extends Vehicle {\n    @Override void start(){ System.out.println(\"Bike starts\"); }\n}\npublic class OverrideDemo {\n    public static void main(String[] args) {\n        Vehicle v = new Bike();\n        v.start();\n    }\n}","output":"Bike starts","flow":"Variable Vehicle v → Actual object Bike → Bike.start() at runtime","recap":"Overriding = subclass redefines inherited instance method; runtime selection.","tip":""},{"id":"B08","part":"B","number":8,"marks":10,"question":"Explain the use of the super keyword with a suitable Java program.","topic":"OOP","definition":"super denotes the immediate superclass and is used to reuse a superclass constructor, field or method.","points":["super(args) invokes a superclass constructor and must appear first in a subclass constructor.","super.field accesses a parent field hidden by a same-named child field.","super.method() calls an overridden superclass implementation.","The keyword is available only in instance context and is not a standalone object reference to store.","It supports explicit parent behavior without copying code.","A constructor implicitly calls super() when possible if no explicit constructor invocation appears."],"syntax":"super(arguments);\nsuper.variable;\nsuper.method();","code":"class ParentInfo {\n    String name = \"Parent\";\n    ParentInfo(int id){ System.out.println(\"ID: \" + id); }\n    void show(){ System.out.println(\"Parent method\"); }\n}\nclass ChildInfo extends ParentInfo {\n    String name = \"Child\";\n    ChildInfo(){ super(7); }\n    @Override void show(){\n        super.show();\n        System.out.println(super.name);\n        System.out.println(name);\n    }\n}\npublic class SuperDemo {\n    public static void main(String[] args) {\n        new ChildInfo().show();\n    }\n}","output":"ID: 7\nParent method\nParent\nChild","flow":"Create ChildInfo → super(7) → Parent constructor → super.show() → Child output","recap":"Three uses: super(), super.member and super.method().","tip":""},{"id":"B09","part":"B","number":9,"marks":10,"question":"Explain the access modifiers in Java with a suitable program.","topic":"OOP","definition":"Access modifiers define where a class member may be used; they are central to encapsulation and API design.","points":["public: accessible wherever its declaring type is accessible.","protected: accessible within the package and in subclasses subject to cross-package protected-access restrictions.","package-private (no keyword): accessible only within the package.","private: accessible only within its enclosing top-level class/nest as allowed by the language.","Top-level Java types may only be public or package-private.","Use private for mutable fields and public methods when an external API is intended; choose minimal visibility."],"syntax":"public int a; protected int b; int c; private int d;","code":"class Account {\n    public String owner = \"Asha\";\n    protected int branch = 12;\n    int code = 21;                 // package-private\n    private double balance = 500;\n    public double getBalance(){ return balance; }\n}\npublic class AccessDemo {\n    public static void main(String[] args) {\n        Account a = new Account();\n        System.out.println(a.owner);\n        System.out.println(a.getBalance());\n    }\n}","output":"Asha\n500.0","flow":"Outside package → public | Package members → public/protected/default | Class internals → private","recap":"Access: public, protected, package-private, private. Private fields + getters support encapsulation.","tip":"For a full answer, present a visibility comparison table."},{"id":"B10","part":"B","number":10,"marks":10,"question":"Explain interfaces in Java and write a program to implement an interface.","topic":"OOP","definition":"An interface is a reference type defining a contract of methods or capabilities that classes can implement.","points":["Declare an interface with interface keyword.","A class implements it using implements, providing public implementations of required abstract methods.","Interface variables are implicitly public static final; abstract declarations are implicitly public abstract.","An implementing class can also inherit a superclass or implement more than one interface.","Interfaces reduce coupling and enable interchangeable implementations.","Modern Java interfaces may also contain default, static and private helper methods; use the older abstract-method form for a simple exam program."],"syntax":"interface Shape { double area(); }\nclass Circle implements Shape { public double area(){...} }","code":"interface Printable {\n    void print();\n}\nclass Report implements Printable {\n    public void print(){ System.out.println(\"Report printed\"); }\n}\npublic class InterfaceDemo {\n    public static void main(String[] args) {\n        Printable p = new Report();\n        p.print();\n    }\n}","output":"Report printed","flow":"Define interface → implements in class → Create object → Interface reference → Call method","recap":"Interface = behavior contract; implementations must use public methods.","tip":""},{"id":"B11","part":"B","number":11,"marks":10,"question":"Explain how Java achieves multiple inheritance using interfaces. Write a suitable program.","topic":"OOP","definition":"Java allows a class to implement several interfaces, achieving multiple inheritance of type without extending multiple classes.","points":["A single class may implement InterfaceA, InterfaceB separated by commas.","It must implement all applicable abstract methods or be declared abstract.","The same object can be viewed through either interface reference.","It avoids ambiguity of multiple superclass instance-state inheritance.","If two default methods conflict, the class must explicitly resolve the conflict.","This is multiple inheritance via interfaces, not multiple class inheritance."],"syntax":"class SmartDevice implements Camera, MusicPlayer { ... }","code":"interface Camera { void click(); }\ninterface MusicPlayer { void play(); }\nclass Phone implements Camera, MusicPlayer {\n    public void click(){ System.out.println(\"Photo taken\"); }\n    public void play(){ System.out.println(\"Music playing\"); }\n}\npublic class MultipleInterfaceDemo {\n    public static void main(String[] args) {\n        Phone p = new Phone();\n        p.click(); p.play();\n    }\n}","output":"Photo taken\nMusic playing","flow":"Camera ─┐\n        ├── implements → Phone\nMusicPlayer ┘","recap":"A class extends at most one class but can implement multiple interfaces.","tip":""},{"id":"B12","part":"B","number":12,"marks":10,"question":"Explain abstract classes and interfaces with suitable examples.","topic":"OOP","definition":"Abstract classes provide shared implementation plus unimplemented methods; interfaces define contracts across different class families.","points":["An abstract class cannot be instantiated and may have constructors, fields, ordinary methods and abstract methods.","A subclass must implement inherited abstract methods unless it is also abstract.","An interface cannot be directly instantiated; implementing classes provide required methods.","One class may extend only one superclass, but implement many interfaces.","Use abstract classes for shared state/implementation; interfaces for shared capabilities.","Public, default, static and private interface methods follow their Java version rules; interface fields are public static final."],"syntax":"abstract class A { abstract void work(); }\ninterface B { void report(); }","code":"abstract class Appliance {\n    void powerOn(){ System.out.println(\"Power ON\"); }\n    abstract void operate();\n}\ninterface Repairable { void repair(); }\nclass Fan extends Appliance implements Repairable {\n    void operate(){ System.out.println(\"Fan rotates\"); }\n    public void repair(){ System.out.println(\"Fan repaired\"); }\n}\npublic class AbstractVsInterface {\n    public static void main(String[] args){\n        Fan f = new Fan(); f.powerOn(); f.operate(); f.repair();\n    }\n}","output":"Power ON\nFan rotates\nFan repaired","flow":"Abstract base → Fan ← Repairable interface → Fan implements both responsibilities","recap":"Abstract class shares a partial implementation; interface shares a contract.","tip":"Comparison: state, constructors, methods, inheritance count, purpose and instantiation."},{"id":"B13","part":"B","number":13,"marks":10,"question":"Explain how to create a user-defined package and import it into another Java program.","topic":"Packages & I/O","definition":"A user-defined package groups related Java classes in a named namespace and can be imported into another source file.","points":["Step 1: declare package packname; at the top of the class file.","Step 2: make the class public if used outside its package.","Step 3: compile with javac -d . to generate the package directory structure.","Step 4: in another file, import packname.ClassName; or refer to packname.ClassName directly.","Step 5: compile/run from the package root with a suitable classpath.","Benefit: name organization, access boundaries and reusability."],"syntax":"package tools;\nimport tools.Greeting;\njavac -d . Greeting.java","code":"// File: Greeting.java\npackage tools;\npublic class Greeting {\n    public void hello(){ System.out.println(\"Hello from tools\"); }\n}\n\n// File: TestPackage.java\nimport tools.Greeting;\npublic class TestPackage {\n    public static void main(String[] args){\n        new Greeting().hello();\n    }\n}\n\n// Commands in the containing folder:\n// javac -d . Greeting.java\n// javac -cp . TestPackage.java\n// java -cp . TestPackage","output":"Hello from tools","flow":"Greeting.java → package tools → javac -d . → tools/Greeting.class → import → TestPackage","recap":"Compile the packaged class with -d .; import with package.Type; run from the classpath root.","tip":""},{"id":"B14","part":"B","number":14,"marks":10,"question":"Explain the different ways of importing packages in Java with examples.","topic":"Packages & I/O","definition":"Importing a package makes selected accessible Java types easier to use by their simple names.","points":["Single-type import: import java.util.Scanner; imports one class by name.","On-demand import: import java.util.*; makes accessible types in that package available; it does not import subpackages.","Static import: import static java.lang.Math.PI; imports static members without the class qualifier.","Fully-qualified use: java.util.Scanner requires no import.","java.lang types such as String are automatically accessible.","Wildcard imports do not copy classes or add runtime overhead; they only affect name resolution."],"syntax":"import java.util.Scanner;\nimport java.util.*;\nimport static java.lang.Math.PI;","code":"import java.util.Scanner;\nimport java.util.ArrayList;\nimport static java.lang.Math.PI;\npublic class ImportDemo {\n    public static void main(String[] args) {\n        ArrayList<String> a = new ArrayList<>();\n        a.add(\"Java\");\n        System.out.println(a.get(0));\n        System.out.println(PI > 3.0);\n        Scanner sc = new Scanner(\"12\");\n        System.out.println(sc.nextInt());\n        sc.close();\n    }\n}","output":"Java\ntrue\n12","flow":"Identify needed type → Single import / wildcard / fully qualified → Compile → Use","recap":"Three forms: single-type, on-demand and static; java.lang is automatic.","tip":""},{"id":"B15","part":"B","number":15,"marks":10,"question":"Explain byte-oriented and character-oriented I/O streams with their important classes.","topic":"Packages & I/O","definition":"Java I/O provides byte-oriented classes for raw binary data and character-oriented classes for encoded text.","points":["Byte base classes: InputStream and OutputStream; examples FileInputStream, FileOutputStream, BufferedInputStream and BufferedOutputStream.","Character base classes: Reader and Writer; examples FileReader, FileWriter, BufferedReader, BufferedWriter.","Input streams read; output streams write.","Character readers/writers handle charset decoding/encoding; prefer specifying a charset explicitly when needed.","Buffered wrappers reduce expensive I/O calls.","Use try-with-resources to close streams even on exceptions.","Choose bytes for images/PDFs and characters for text files."],"syntax":"try (InputStream in = new FileInputStream(\"a.bin\")) { ... }\ntry (Reader r = new FileReader(\"a.txt\")) { ... }","code":"import java.io.*;\npublic class StreamTypesDemo {\n    public static void main(String[] args) throws IOException {\n        try (FileOutputStream out = new FileOutputStream(\"demo.bin\")) {\n            out.write(65); // ASCII byte for A\n        }\n        try (FileInputStream in = new FileInputStream(\"demo.bin\")) {\n            System.out.println((char) in.read());\n        }\n        try (FileWriter w = new FileWriter(\"demo.txt\")) {\n            w.write(\"Java text\");\n        }\n        try (FileReader r = new FileReader(\"demo.txt\")) {\n            System.out.println((char) r.read());\n        }\n    }\n}","output":"A\nJ","flow":"Source file → byte InputStream / character Reader → Java | Java → OutputStream/Writer → Destination","recap":"Byte I/O = InputStream/OutputStream; character I/O = Reader/Writer.","tip":""},{"id":"B16","part":"B","number":16,"marks":10,"question":"Write a Java program to perform file operations using file input and output streams.","topic":"Packages & I/O","definition":"FileInputStream reads bytes from a file and FileOutputStream writes bytes to a file.","points":["Aim: create one file, write content, then read and display its bytes.","FileOutputStream opens/creates destination; write(byte[]) writes the data.","FileInputStream opens the existing file; read() returns the next byte (0–255) or -1 at end.","Loop until read() returns -1 and display the characters for the ASCII example.","Use try-with-resources to close both streams safely.","For arbitrary binary files, copy bytes directly rather than converting to characters; errors may throw IOException."],"syntax":"FileOutputStream out = new FileOutputStream(\"test.txt\");\nFileInputStream in = new FileInputStream(\"test.txt\");","code":"import java.io.*;\nimport java.nio.charset.StandardCharsets;\npublic class FileOperations {\n    public static void main(String[] args) throws IOException {\n        String data = \"Hello Java File\";\n        try (FileOutputStream out = new FileOutputStream(\"test.txt\")) {\n            out.write(data.getBytes(StandardCharsets.UTF_8));\n        }\n        try (FileInputStream in = new FileInputStream(\"test.txt\")) {\n            int b;\n            while ((b = in.read()) != -1)\n                System.out.print((char) b); // ASCII example\n        }\n        System.out.println();\n    }\n}","output":"Hello Java File","flow":"Start → Open output → Write bytes → Close → Open input → read() != -1? → Display → Close","recap":"FileOutputStream.write() saves bytes; FileInputStream.read() reads them; -1 marks EOF.","tip":""},{"id":"B17","part":"B","number":17,"marks":10,"question":"Write a Java program to read characters from the console and display the output.","topic":"Packages & I/O","definition":"Console character input can be read through InputStreamReader with BufferedReader, and output is printed using System.out.","points":["System.in is a byte stream connected to standard input.","InputStreamReader converts bytes to characters using a charset.","BufferedReader provides readLine() for reading complete lines.","System.out.println() displays results in the console.","A read operation may throw IOException; handle or declare it.","In an interactive exam example, show sample input separately from output."],"syntax":"BufferedReader br = new BufferedReader(new InputStreamReader(System.in));\nString line = br.readLine();","code":"import java.io.*;\npublic class ConsoleCharacters {\n    public static void main(String[] args) throws IOException {\n        BufferedReader br = new BufferedReader(\n            new InputStreamReader(System.in));\n        System.out.print(\"Enter your name: \");\n        String name = br.readLine();\n        System.out.println(\"Welcome, \" + name);\n    }\n}","output":"Enter your name: Asha\nWelcome, Asha","flow":"Keyboard → System.in → InputStreamReader → BufferedReader.readLine() → System.out","recap":"InputStreamReader converts bytes; BufferedReader reads text lines.","tip":""},{"id":"B18","part":"B","number":18,"marks":10,"question":"Explain the Java Collections Framework and its hierarchy with a neat diagram.","topic":"Collections","definition":"The Java Collections Framework (JCF) is a unified architecture of interfaces, implementing classes and algorithms for storing groups of objects.","points":["Iterable is the root for enhanced-for iteration; Collection extends Iterable.","List keeps order and duplicates: ArrayList, LinkedList, Vector (legacy).","Set avoids duplicates: HashSet, LinkedHashSet, TreeSet; SortedSet/NavigableSet define ordering.","Queue represents waiting elements; PriorityQueue prioritizes elements; Deque supports both ends with ArrayDeque or LinkedList.","Map stores key-value pairs and is separate from Collection: HashMap, LinkedHashMap, TreeMap.","Collections utility offers sorting, searching and reversal for suitable collections.","Generics (Collection<E>) provide compile-time element typing."],"syntax":"List<String> names = new ArrayList<>();\nSet<Integer> ids = new HashSet<>();\nMap<String,Integer> marks = new HashMap<>();","code":"import java.util.*;\npublic class CollectionsDemo {\n    public static void main(String[] args) {\n        List<Integer> list = new ArrayList<>(Arrays.asList(3, 1, 3));\n        Set<Integer> set = new LinkedHashSet<>(list);\n        Collections.sort(list);\n        System.out.println(list);\n        System.out.println(set);\n    }\n}","output":"[1, 3, 3]\n[3, 1]","flow":"Iterable\n   └─ Collection\n       ├─ List → ArrayList, LinkedList\n       ├─ Set → HashSet, TreeSet\n       └─ Queue → Deque, PriorityQueue\nMap → HashMap, TreeMap  (separate)","recap":"Collection → List / Set / Queue; Map is outside the Collection inheritance tree.","tip":""},{"id":"B19","part":"B","number":19,"marks":10,"question":"Explain the important methods of the ArrayList class with a suitable Java program.","topic":"Collections","definition":"ArrayList is a resizable-array implementation of List that preserves insertion order and allows duplicates.","points":["add(E) appends; add(index,E) inserts and shifts later elements.","get(index) fetches; set(index,E) replaces.","remove(index) or remove(Object) deletes; clear() removes all.","size() returns count; contains(Object) tests membership.","isEmpty() checks zero size; indexOf(Object) returns first matching index.","Indexed access is typically constant time; middle insert/delete may move many elements.","Generic types such as ArrayList<String> enforce element type at compile time."],"syntax":"ArrayList<String> list = new ArrayList<>();\nlist.add(\"A\"); list.set(0,\"B\"); list.get(0);","code":"import java.util.*;\npublic class ArrayListMethods {\n    public static void main(String[] args) {\n        ArrayList<String> a = new ArrayList<>();\n        a.add(\"Java\"); a.add(\"Python\"); a.add(\"C\");\n        a.set(1, \"SQL\");\n        System.out.println(a.get(1));\n        System.out.println(a.contains(\"C\"));\n        a.remove(\"Java\");\n        System.out.println(a);\n        System.out.println(\"Size: \" + a.size());\n    }\n}","output":"SQL\ntrue\n[SQL, C]\nSize: 2","flow":"Create → add() → get()/set() → contains() → remove() → size()","recap":"Core ArrayList methods: add, get, set, remove, size, contains.","tip":""},{"id":"B20","part":"B","number":20,"marks":10,"question":"Write a Java program to demonstrate the operations of an ArrayList.","topic":"Collections","definition":"ArrayList supports dynamic insertion, retrieval, modification, searching and removal of elements.","points":["Aim: demonstrate frequently used operations on a student-subject list.","Create ArrayList<String> and add several items.","Insert with add(index, value) to place a value at a chosen index.","Access with get(index) and update with set(index, newValue).","Remove a named element and check the current size.","Iterate with an enhanced for loop; ArrayList maintains ordered positions and permits duplicates."],"syntax":"ArrayList<String> list = new ArrayList<>();\nlist.add(value); list.set(index,value); list.remove(value);","code":"import java.util.*;\npublic class ArrayListOperations {\n    public static void main(String[] args) {\n        ArrayList<String> subjects = new ArrayList<>();\n        subjects.add(\"Java\");\n        subjects.add(\"Maths\");\n        subjects.add(1, \"AI\");\n        subjects.set(2, \"DSA\");\n        subjects.remove(\"AI\");\n        for (String s : subjects) System.out.println(s);\n        System.out.println(\"Total: \" + subjects.size());\n    }\n}","output":"Java\nDSA\nTotal: 2","flow":"Empty list → add Java → insert AI → replace Maths with DSA → remove AI → Print","recap":"An ArrayList changes size automatically; indexing begins at zero.","tip":""},{"id":"B21","part":"B","number":21,"marks":10,"question":"Explain the important methods of the LinkedList class with a suitable program.","topic":"Collections","definition":"LinkedList is a doubly-linked Java List/Deque implementation in which each node connects to adjacent nodes.","points":["add(E), addFirst(E), addLast(E) insert elements; offerFirst/offerLast are deque variants.","getFirst(), getLast(), peekFirst() and peekLast() access ends (peek returns null if empty).","removeFirst(), removeLast() delete end elements; poll variants return null on empty.","get(index) and set(index,E) provide positional operations but require traversal.","LinkedList permits duplicates and null values; iteration preserves list order.","Efficient operations at ends contrast with O(n) indexed access; use ArrayList for frequent random access."],"syntax":"LinkedList<Integer> q = new LinkedList<>();\nq.addFirst(10); q.addLast(30); q.removeFirst();","code":"import java.util.*;\npublic class LinkedListMethods {\n    public static void main(String[] args) {\n        LinkedList<String> l = new LinkedList<>();\n        l.add(\"B\"); l.addFirst(\"A\"); l.addLast(\"C\");\n        System.out.println(l.getFirst());\n        System.out.println(l.getLast());\n        l.removeFirst();\n        System.out.println(l);\n    }\n}","output":"A\nC\n[B, C]","flow":"Head ⇄ A ⇄ B ⇄ C ⇄ Tail → addFirst/removeFirst at head","recap":"LinkedList is a doubly-linked List with useful Deque operations.","tip":""},{"id":"B22","part":"B","number":22,"marks":10,"question":"Write a Java program to sort the elements of a LinkedList.","topic":"Collections","definition":"Collections.sort(List) sorts elements in natural ascending order for comparable values such as strings or integers.","points":["Aim: create a LinkedList of integers and sort it.","Store input in LinkedList<Integer>.","Call Collections.sort(list) to reorder in ascending order.","Print before and after sorting.","For descending order use list.sort(Collections.reverseOrder()).","The operation updates the existing list and is based on comparison; input elements must be mutually comparable."],"syntax":"Collections.sort(linkedList);\nlinkedList.sort(Collections.reverseOrder());","code":"import java.util.*;\npublic class LinkedListSort {\n    public static void main(String[] args) {\n        LinkedList<Integer> a = new LinkedList<>();\n        a.add(42); a.add(10); a.add(25); a.add(7);\n        System.out.println(\"Before: \" + a);\n        Collections.sort(a);\n        System.out.println(\"After: \" + a);\n    }\n}","output":"Before: [42, 10, 25, 7]\nAfter: [7, 10, 25, 42]","flow":"Start → Store numbers → Collections.sort() → Traverse/list print → End","recap":"Collections.sort(list) modifies the list into ascending natural order.","tip":""},{"id":"B23","part":"B","number":23,"marks":10,"question":"Explain the Iterator interface and its methods with a suitable Java program.","topic":"Collections","definition":"Iterator<E> is a java.util interface for sequential traversal of collections without exposing their implementation.","points":["Obtain an Iterator from collection.iterator().","hasNext() returns true while another element remains.","next() returns an element and advances; it throws NoSuchElementException when exhausted.","remove() is an optional operation for removing the last returned element safely where supported.","forEachRemaining(Consumer) applies an action to the remaining elements (Java 8+).","Iterators typically support one-way traversal; ListIterator supports bidirectional List traversal."],"syntax":"Iterator<T> it = collection.iterator();\nwhile (it.hasNext()) { T item = it.next(); }","code":"import java.util.*;\npublic class IteratorExample {\n    public static void main(String[] args) {\n        ArrayList<Integer> nums = new ArrayList<>(Arrays.asList(1, 2, 3, 4));\n        Iterator<Integer> it = nums.iterator();\n        while (it.hasNext()) {\n            int n = it.next();\n            if (n % 2 == 0) it.remove();\n        }\n        System.out.println(nums);\n    }\n}","output":"[1, 3]","flow":"iterator() → hasNext()? yes → next() → condition → optional remove() → repeat → Stop","recap":"Iterator methods: hasNext(), next(), optional remove(), forEachRemaining().","tip":""},{"id":"B24","part":"B","number":24,"marks":10,"question":"Differentiate between ArrayList and LinkedList with suitable examples.","topic":"Collections","definition":"ArrayList and LinkedList both implement List, but store elements differently and have different performance characteristics.","points":["Storage: ArrayList uses a resizable array; LinkedList uses doubly linked nodes.","Index access: ArrayList usually O(1); LinkedList O(n) for get(index).","Insert/remove in middle: ArrayList shifts entries O(n); LinkedList searches O(n), then relinks quickly once position is known.","End operations: ArrayList append is amortized O(1); LinkedList offers O(1) insertion/removal at both ends.","Memory: LinkedList generally uses more per element for node references.","Both allow duplicates, null and preserve order; both support Iterable and List methods.","Default choice: ArrayList for most cases; LinkedList mainly where deque-style operations are central."],"syntax":"List<String> a = new ArrayList<>();\nDeque<String> b = new LinkedList<>();","code":"import java.util.*;\npublic class ListCompare {\n    public static void main(String[] args) {\n        ArrayList<String> a = new ArrayList<>();\n        a.add(\"A\"); a.add(\"B\");\n        LinkedList<String> b = new LinkedList<>();\n        b.addFirst(\"B\"); b.addFirst(\"A\");\n        System.out.println(a.get(1));\n        System.out.println(b.removeFirst());\n    }\n}","output":"B\nA","flow":"Need indexed retrieval? → ArrayList | Need frequent deque-end operations? → LinkedList","recap":"ArrayList stores contiguous references; LinkedList stores linked nodes. Both are Lists.","tip":"In a comparison table: data structure, access, insertion, memory, use case, interfaces."},{"id":"B25","part":"B","number":25,"marks":10,"question":"Explain exception handling in Java using try, catch, finally, throw and throws.","topic":"Exceptions","definition":"Java exception handling uses try/catch/finally and the throw/throws keywords to report and respond to runtime problems.","points":["try encloses code that may throw an exception.","catch(Type e) handles matching exceptions; order specific catches before broad catches.","finally normally runs after try/catch for cleanup, even on return; there are rare abnormal termination exceptions.","throw creates/raises one Throwable instance, for example new IllegalArgumentException().","throws in the method signature declares exceptions that can propagate to the caller.","Checked exceptions require handling/declaration; RuntimeException subclasses are unchecked.","try-with-resources is usually preferred to manually closing AutoCloseable resources."],"syntax":"try { ... } catch (ExceptionType e) { ... } finally { ... }\nvoid read() throws IOException { throw new IOException(\"...\"); }","code":"import java.io.IOException;\npublic class ExceptionKeywords {\n    static void validate(int n) throws IOException {\n        if (n < 0) throw new IOException(\"Negative value\");\n        System.out.println(\"Valid\");\n    }\n    public static void main(String[] args) {\n        try {\n            validate(-1);\n        } catch (IOException e) {\n            System.out.println(\"Caught: \" + e.getMessage());\n        } finally {\n            System.out.println(\"Finished\");\n        }\n    }\n}","output":"Caught: Negative value\nFinished","flow":"try → Validate → throw IOException → catch IOException → finally → End","recap":"Remember: try = risky code; catch = handle; finally = cleanup; throw = raise; throws = declare.","tip":""},{"id":"B26","part":"B","number":26,"marks":10,"question":"Write a Java program to demonstrate multiple catch blocks.","topic":"Exceptions","definition":"Multiple catch blocks let one try statement handle different exception types with separate actions.","points":["Place risky operations inside one try block.","Write one catch per exception type, with its own handler.","If exceptions are related by inheritance, place more specific exception types before superclass types.","Only the first compatible catch handler executes for a thrown exception.","An optional finally block executes after handling.","This approach is useful when errors require distinct messages or recovery actions."],"syntax":"try { ... } catch(ArithmeticException e) { ... } catch(ArrayIndexOutOfBoundsException e) { ... }","code":"public class MultipleCatchDemo {\n    public static void main(String[] args) {\n        try {\n            int[] a = {10, 20};\n            int choice = 1;\n            if (choice == 1) System.out.println(10 / 0);\n            else System.out.println(a[5]);\n        } catch (ArithmeticException e) {\n            System.out.println(\"Division by zero\");\n        } catch (ArrayIndexOutOfBoundsException e) {\n            System.out.println(\"Invalid index\");\n        } finally {\n            System.out.println(\"End of try\");\n        }\n    }\n}","output":"Division by zero\nEnd of try","flow":"try → Exception type? → Arithmetic catch / ArrayIndex catch → finally","recap":"Multiple catches = separate handlers for separate exception categories.","tip":""},{"id":"B27","part":"B","number":27,"marks":10,"question":"Write a Java program to demonstrate a multi-catch block.","topic":"Exceptions","definition":"Multi-catch combines several unrelated exception types in a single catch clause using | (introduced in Java 7).","points":["It avoids repeating identical error-handling code.","Alternatives use one exception variable separated by |.","The alternatives cannot include a type and one of its subclasses together.","The multi-catch variable cannot be reassigned.","A single error handler executes whichever listed type was thrown.","Use separate catches when different exceptions need different recovery actions."],"syntax":"catch (IOException | NumberFormatException e) { ... }","code":"import java.io.*;\npublic class MultiCatchDemo {\n    public static void main(String[] args) {\n        try {\n            String text = \"not-a-number\";\n            int n = Integer.parseInt(text);\n            new FileInputStream(\"missing.txt\").close();\n            System.out.println(n);\n        } catch (NumberFormatException | IOException e) {\n            System.out.println(\"Handled: \" + e.getClass().getSimpleName());\n        }\n    }\n}","output":"Handled: NumberFormatException","flow":"try → NumberFormatException OR IOException → Same catch handler → Continue","recap":"Multiple catch blocks are different from one multi-catch block with |.","tip":""},{"id":"B28","part":"B","number":28,"marks":10,"question":"Explain the different types of exceptions in Java with suitable examples.","topic":"Exceptions","definition":"Exceptions represent unusual execution conditions; Java divides them into checked and unchecked exceptions, while Errors form another Throwable branch.","points":["Checked exceptions are Exception subclasses outside RuntimeException: IOException, FileNotFoundException, SQLException; compiler requires catch/declare.","Unchecked exceptions are RuntimeException subclasses: ArithmeticException, NullPointerException, ArrayIndexOutOfBoundsException, NumberFormatException.","Error subclasses include OutOfMemoryError and StackOverflowError, usually not routine recoverable exceptions.","A try/catch can provide a graceful message for anticipated failures.","A throws clause passes checked exceptions to callers.","Correct the underlying conditions rather than relying on catches for routine control flow."],"syntax":"Throwable → Error | Exception → checked exceptions / RuntimeException (unchecked)","code":"import java.io.*;\npublic class ExceptionTypesDemo {\n    public static void main(String[] args) {\n        try {\n            new FileInputStream(\"no-file.txt\").close();\n        } catch (FileNotFoundException e) {\n            System.out.println(\"Checked: missing file\");\n        } catch (IOException e) {\n            System.out.println(\"I/O problem\");\n        }\n        try {\n            int x = Integer.parseInt(\"abc\");\n            System.out.println(x);\n        } catch (NumberFormatException e) {\n            System.out.println(\"Unchecked: invalid number\");\n        }\n    }\n}","output":"Checked: missing file\nUnchecked: invalid number","flow":"Throwable → Error / Exception → Checked | RuntimeException → Unchecked","recap":"Checked must be caught or declared; unchecked need not; Errors are separate.","tip":""},{"id":"B29","part":"B","number":29,"marks":10,"question":"Explain the life cycle of a thread with a neat diagram.","topic":"Threads","definition":"The life cycle of a Java thread describes its states from creation through execution and termination.","points":["NEW: Thread object exists but start() was not called.","RUNNABLE: ready or executing; Java Thread.State does not define a separate RUNNING enum value.","BLOCKED: waiting to enter a synchronized monitor protected by another thread.","WAITING: waiting indefinitely for another thread action, e.g., wait() or join().","TIMED_WAITING: waits with time limit, e.g., sleep(1000), wait(timeout), join(timeout).","TERMINATED: run() completed or ended by uncaught exception.","Thread.start() transitions NEW to RUNNABLE; scheduling, synchronization, notification and timeouts cause further changes."],"syntax":"Thread t = new Thread(() -> System.out.println(\"Run\"));\nt.start();\nt.getState();","code":"public c
