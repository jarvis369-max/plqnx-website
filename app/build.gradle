plugins {
    id 'com.android.application'
}
android {
    namespace 'com.plqnx.java'
    compileSdk 35
    defaultConfig {
        applicationId 'com.plqnx.javadropzone'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }
    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
