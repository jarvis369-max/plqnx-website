services:
  - type: web
    name: plqnx-core
    runtime: python
    repo: https://github.com/jarvis369-max/plqnx-website
    branch: main
    plan: 1c-2g
    region: singapore
    buildCommand: bash render-build.sh
    startCommand: bash render-start.sh
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: OLLAMA_HOST
        value: 127.0.0.1:11434
      - key: OLLAMA_MAX_LOADED_MODELS
        value: "1"
      - key: OLLAMA_NUM_PARALLEL
        value: "1"
